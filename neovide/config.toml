# title-hidden
frame = "buttonless"

# animal
no-multigrid = false

# Detach from the terminal instead of waiting for the Neovide process to terminate
fork = true

# when change to render
idle = true

# max windows
maximized = false

# mouse cursor
mouse-cursor-icon = "arrow"

# macos only hiden title
title-hidden = true

# srgb
srgb = true

# tabs
tabs = true

# keep macOS native tab bar visible (required, otherwise tab hotkeys do nothing)
# system-native-tabs = true

# macOS hotkeys -- must stay at top level (before any [table] header!)
# valid modifiers: cmd / ctrl / alt (= Option) / shift. "opt" is NOT a valid token.
system-new-window-hotkey = "ctrl+shift+n"
system-switcher-hotkey = "ctrl+shift+p"
# system-tab-prev-hotkey = "cmd+shift+["
# system-tab-next-hotkey = "cmd+shift+]"

# theme
theme = "auto"

# sync to monitor
vsync = true

# close wsl
wsl = false


# font set
[font]
normal = ["Maple Mono Normal NF CN"]
size = 18

[box-drawing]
# "font-glyph", "native" or "selected-native"
mode = "native"


