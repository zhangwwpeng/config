# vim:fileencoding=utf-8:foldmethod=marker

#: 字体设置 {{{

#: kitty 拥有非常强大的字体管理功能。你可以配置
#: 单独的字体样式，甚至为特定字符指定特殊字体。

font_family      Maple Mono Normal NF CN
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

#: 你可以为粗体/斜体/粗斜体变体指定不同的字体。
#: 最简单的选字方法是运行 `kitten choose-fonts` 命令，
#: 它会提供一个漂亮的 UI 界面让你选择字体，
#: 支持预览、可变字体和字体特性选择。
#: 如果你想手动选择字体，请阅读字体规范语法：
#: <https://sw.kovidgoyal.net/kitty/kittens/choose-fonts/#font-spec-syntax>。

font_size 18.0

#: 字体大小（单位：磅/pt）。

# force_ltr no

#: kitty 不支持 BIDI（双向文本），但是对于 RTL（从右到左）
#: 文字，单词会自动以 RTL 顺序显示。也就是说，
#: 在 RTL 文字中，"HELLO WORLD" 会显示为
#: "WORLD HELLO"，如果你尝试选中 RTL 字符串的子串，
#: 你获取到的字符将是该字符串按 LTR 排列时的对应字符。
#: 例如，对于希伯来单词 ירושלים，
#: 屏幕上看似选中的是 ם，实际写入选择缓冲区的却是字符 י。
#: kitty 的默认行为适合配合过滤器来反转单词顺序，
#: 但如果你需要直接操作 RTL 字形，这可能会非常困难，
#: 所以提供了这个选项来关闭它。
#: 此外，这个选项可以配合命令行程序 GNU FriBidi
#: <https://github.com/fribidi/fribidi#executable>
#: 来获得 BIDI 支持，因为它会强制 kitty 始终
#: 将文本视为 LTR，这正是 FriBidi 对终端的要求。

# symbol_map

#: 例如: symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols

#: 将指定的 Unicode 码点映射到特定字体。
#: 适用于需要为某些符号（如 Powerline）进行特殊渲染的场景。
#: 可以避免使用打了补丁的字体。
#: 每个 Unicode 码点以 `U+<十六进制码点>` 格式指定。
#: 你可以指定多个码点，用逗号分隔，用连字符表示范围。
#: 此选项可以多次指定。语法为::

#:     symbol_map 码点 字体族名称

# narrow_symbols

#: 例如: narrow_symbols U+E0A0-U+E0A3,U+E0C0-U+E0C7 1

#: 通常，对于私人使用区域的 Unicode 字符和一些符号/装饰
#: 字符，如果字符后面跟有一个或多个空格，
#: kitty 会利用这些额外的单元格将字符渲染得更大，
#: 前提是字体中的该字符具有较宽的宽高比。
#: 使用此选项可以强制 kitty 将指定的码点
#: 限制在指定数量的单元格内渲染（默认为一个单元格）。
#: 此选项可以多次指定。语法为::

#:     narrow_symbols 码点 [可选的单元格数量]

# disable_ligatures never

#: 选择如何处理多字符连字。默认为始终渲染它们。
#: 你可以通过 `cursor` 值让 kitty 在光标位于连字上方时
#: 不渲染它们，以便于编辑；或者如果你不喜欢连字，
#: 通过 `always` 值让 kitty 完全不渲染它们。
#: 连字策略可以按窗口设置，可以使用 kitty 远程控制
#: 或在 kitty.conf 中定义快捷键，例如::

#:     map alt+1 disable_ligatures_in active always
#:     map alt+2 disable_ligatures_in all never
#:     map alt+3 disable_ligatures_in tab cursor

#: 注意，这指的是编程连字，通常通过
#: calt OpenType 特性实现。要禁用通用连字，
#: 请使用 font_features 选项。

# font_features

#: 例如: font_features none

#: 精确选择要启用或禁用的 OpenType 特性。
#: 注意，对于主字体，可以在使用 choose-fonts kitten
#: 选择字体时指定特性。此设置对于回退字体很有用。

#: 有些字体可能有在终端中值得使用的特性。
#: 例如，Fira Code 包含一个可选特性 zero，
#: 在该字体中会改变零 (0) 的外观，
#: 使其更容易与 Ø 区分。Fira Code 还包含其他
#: 可选特性，称为风格集，标签为 ss01 到 ss20。

#: 关于各个特性的确切语法，请参阅
#: HarfBuzz 文档：
#: <https://harfbuzz.github.io/harfbuzz-hb-common.html#hb-feature-from-string>。

#: 注意，此配置按 PostScript 名称索引，而非字体族名称。
#: 这允许你定义非常精确的特性设置；
#: 例如，你可以在斜体字体中禁用某个特性，但在常规字体中不禁用。

#: 在 Linux 上，字体特性首先从 FontConfig 数据库读取，
#: 然后再应用此选项，因此可以在一个集中的位置进行配置。

#: 要获取字体的 PostScript 名称，在 Linux 上使用
#: `fc-scan file.ttf` 命令，或在 macOS 上使用
#: Font Book 工具。

#: 启用替代零和旧式数字::

#:     font_features FiraCode-Retina +zero +onum

#: 仅在粗体字体中启用替代零::

#:     font_features FiraCode-Bold +zero

#: 禁用普通连字，但保留 calt 特性（在该字体中可打破单调感）::

#:     font_features TT2020StyleB-Regular -liga +calt

#: 配合 force_ltr，你可能想完全禁用阿拉伯语整形，
#: 只在文档中出现时查看其独立形式。可以这样做::

#:     font_features UnifontMedium +isol -medi -fina -init

# modify_font

#: 修改字体特性，如下划线或删除线的位置和粗细。
#: 修改值可以带 px 后缀（像素）或 % 后缀（原始值的百分比）。
#: 无后缀表示使用磅/pt。例如::

#:     modify_font underline_position -2
#:     modify_font underline_thickness 150%
#:     modify_font strikethrough_thickness 200%
#:     modify_font strikethrough_position 2px

#: 此外，你还可以修改每个字体字形渲染的单元格大小
#: 以及字形在单元格中的基线位置。例如::

#:     modify_font cell_width 80%
#:     modify_font cell_height -2px
#:     modify_font baseline 3

#: 注意，修改基线会自动调整下划线和删除线的
#: 位置。增加基线会将字形在单元格中上移，
#: 减小基线则会下移。减小单元格大小可能会导致
#: 渲染瑕疵，请谨慎使用。

# box_drawing_scale 0.001, 1, 1.5, 2

#: Box Drawing（制表符）Unicode 字符使用的线条粗细。
#: 这些值以磅/pt 为单位。它们会根据显示器 DPI 进行缩放
#: 以得到像素值。必须有四个值，分别对应
#: 细线、正常、粗线和非常粗的线。

# undercurl_style thin-sparse

#: 波浪下划线的渲染样式。此选项的格式为
#: (thin|thick)-(sparse|dense)。
#: thin 和 thick 控制波浪下划线的粗细。
#: sparse 和 dense 控制波浪的振荡频率。
#: sparse 每个字符波峰一次，dense 每个字符波峰两次。
#: 通过重载配置或远程控制动态更改此选项的行为是未定义的。

# underline_exclusion 1

#: 默认情况下，当基线下行部分（字母在基线以下的部分，
#: 如 y、q、p 等）与下划线重叠时，
#: kitty 会在下划线中渲染间隙。
#: 此选项控制间隙的粗细。
#: 可以是无单位的数字（表示字体中指定的下划线粗细的比例），
#: 也可以带 px 后缀（像素）或 pt 后缀（磅）。
#: 设为零可禁用间隙。
#: 通过重载配置或远程控制动态更改此选项的行为是未定义的。

# text_composition_strategy platform

#: 控制 kitty 如何将文本字形合成到背景色上。
#: 默认值 platform 尝试使文本渲染尽可能接近
#: kitty 运行平台的"原生"效果。

#: legacy 值使用旧版（kitty 0.28 之前）的字形合成策略。
#: 这会使浅色背景上的深色文本看起来更粗，
#: 深色背景上的浅色文本看起来更细。
#: 也可能使某些文本的笔画看起来不均匀。

#: 你可以通过为此设置指定最多两个空格分隔的数字
#: 来微调字形合成的实际对比度曲线。

#: 第一个数字是 gamma 调整，控制浅色背景上
#: 深色文本的粗细。增加值会使文本看起来更粗。
#: Linux 上的默认值是 1.0，macOS 上是 1.7。
#: 有效值在 0.01 及以上。结果会根据背景和前景
#: 之间的亮度差异进行缩放。浅色背景上的深色文本
#: 受到曲线的全部影响，而深色背景上的浅色文本
#: 受影响很小。

#: 第二个数字是额外的乘法对比度。
#: 它是 0 到 100 的百分比。Linux 上的默认值是 0，
#: macOS 上是 30。

#: 如果你希望在浅色和深色主题中获得相似粗细的
#: 视觉效果，一个好的实验方法是先将值设为
#: 1.0 0 并使用深色主题。然后调整第二个参数
#: 直到看起来满意。再切换到浅色主题，调整第一个参数
#: 直到感知的粗细与深色主题匹配。

# text_fg_override_threshold 0

#: 防止前景色和背景色之间对比度太低的设置。
#: 当使用的应用程序的颜色与你偏好的配色方案
#: 对比度不佳时很有用。默认值为 0，表示不执行
#: 颜色覆盖。有两种操作模式：

#: 带 ratio 后缀的值表示前景色和背景色之间
#: 最小可接受的对比度比率。可能的值范围从
#: 0.0 ratio 到 21.0 ratio。例如，要满足
#: WCAG AA 级别，可以提供 4.5 ratio 的值。
#: 算法使用 HSLuv <https://www.hsluv.org/> 实现，
#: 可以在不显著改变色相和饱和度的情况下，
#: 仅按需改变颜色的感知亮度。

#: 带 % 后缀的值表示前景色和背景色之间
#: 最小可接受的亮度差，低于此值时 kitty 将覆盖
#: 前景色。它是 0% 到 100% 的百分比。
#: 如果前景和背景的亮度差低于此阈值，
#: 前景色将被设为白色（如果背景是深色的）或
#: 黑色（如果背景是浅色的）。

#: 警告：某些程序使用字符（如块字符）进行图形显示，
#: 可能期望能够将前景和背景设为相同（或相似的）颜色。
#: 如果你看到意外的条纹、点、线条、颜色不正确
#: 或任何图形显示问题，请尝试将
#: text_fg_override_threshold 设为 0，
#: 看看这是否是问题的原因，
#: 或考虑使用上述的 ratio 操作模式代替 % 操作模式。

#: }}}

#: 文本光标自定义 {{{

# cursor #cccccc

#: 默认文本光标颜色。如果设为特殊值 none，
#: 光标将以"反色"效果渲染。其颜色将是
#: 所覆盖单元格的文本颜色，而文本将以
#: 单元格的背景色渲染。注意，如果终端中运行的
#: 程序设置了光标颜色，则程序设置优先。
#: 此外，如果单元格背景色和前景色对比度非常低，
#: 光标颜色会被修改。注意，某些主题会设置此值，
#: 所以如果你想覆盖它，请将你的值放在
#: 主题文件 include 行之后。

# cursor_text_color #111111

#: 光标下方文本的颜色。如果你希望它使用
#: 下方单元格的背景色渲染，请使用特殊关键字
#: `background`。注意，如果 cursor 设为 none，
#: 则此选项被忽略。注意，某些主题会设置此值，
#: 所以如果你想覆盖它，请将你的值放在
#: 主题文件 include 行之后。

# cursor_shape block

#: 光标形状可以是 block（方块）、beam（竖线）、
#: underline（下划线）之一。注意，重载配置时，
#: 只有当光标形状未被终端中运行的程序设置时才会改变。
#: 这只设置默认光标形状，终端中运行的应用程序
#: 可以覆盖它。特别是 kitty 中的 shell 集成
#: 会在 shell 提示符处将光标形状设为 beam。
#: 你可以通过将 shell_integration 设为 no-cursor 来避免。

# cursor_shape_unfocused hollow

#: 定义 OS 窗口失去焦点时的文本光标形状。
#: 未聚焦光标形状可以是 block、beam、underline、
#: hollow（空心）和 unchanged（保持原状）之一。

# cursor_beam_thickness 1.5

#: 竖线光标的粗细（单位：磅/pt）。

# cursor_underline_thickness 2.0

#: 下划线光标的粗细（单位：磅/pt）。

# cursor_blink_interval -1

#: 光标闪烁的间隔（秒）。设为零禁用闪烁。
#: 负值表示使用系统默认值。注意，
#: 最小间隔将受限于 repaint_delay。
#: 你还可以通过指定缓动函数来为光标闪烁添加动画。
#: 例如，将此选项设为 0.5 ease-in-out 将使光标
#: 在一秒内闪烁，前半秒从不透明变为透明，
#: 后半秒再从透明变回不透明。
#: 你可以为两个半程指定不同的缓动函数，
#: 例如：-1 linear ease-out。
#: kitty 支持所有 CSS 缓动函数
#: <https://developer.mozilla.org/en-US/docs/Web/CSS/easing-function>。
#: 注意，开启动画会使用额外的电量，因为屏幕
#: 每个闪烁间隔会重绘多次。
#: 另见 cursor_stop_blinking_after。
#: 此设置也控制闪烁文本，它与光标以完全相同的节奏闪烁。

# cursor_stop_blinking_after 15.0

#: 在指定的键盘闲置秒数后停止光标闪烁。
#: 设为零永不停止闪烁。
#: 此设置也控制闪烁文本，它与光标以完全相同的节奏闪烁。

# cursor_trail 0

#: 将此值设为大于零以启用"光标拖尾"动画。
#: 这是一个在文本光标移动时显示"拖尾"的动画。
#: 它使大的光标跳跃易于跟随，并产生光标
#: 在屏幕上快速移动的酷炫视觉效果。
#: 此选项的实际值控制动画何时触发。
#: 它是一个毫秒数。拖尾动画只跟随
#: 在当前位置停留时间超过指定毫秒数的光标。
#: 这可以防止在复杂应用程序中 UI 更新期间
#: 快速改变位置的光标出现拖尾。
#: 参见 cursor_trail_decay 控制动画速度，
#: cursor_trail_start_threshold 控制何时开始光标拖尾。

# cursor_trail_decay 0.1 0.4

#: 当启用 cursor_trail 时，控制光标拖尾效果的衰减时间。
#: 此选项接受两个正浮点数，分别指定最快和最慢的
#: 衰减时间（秒）。第一个值对应最快的衰减时间（最小值），
#: 第二个值对应最慢的衰减时间（最大值）。
#: 第二个值必须等于或大于第一个值。
#: 较小的值导致光标拖尾更快消失。
#: 调整这些值来控制光标拖尾淡出的速度。

# cursor_trail_start_threshold 2

#: 设置开始光标拖尾的距离阈值。
#: 此选项接受一个正整数，表示光标必须移动的
#: 最小单元格数才会开始拖尾。
#: 当光标移动小于此阈值时，跳过拖尾，
#: 减少不必要的光标拖尾动画。

# cursor_trail_color none

#: 当启用 cursor_trail 时设置光标拖尾的颜色。
#: 如果设为 'none'（默认值），光标拖尾将使用
#: 光标的背景色。否则，指定一个颜色值
#: （例如 #ff0000 表示红色，或 'red' 这样的命名颜色）。
#: 这允许你独立于光标颜色自定义拖尾的外观。

#: }}}

#: 回滚缓冲区 {{{

# scrollback_lines 2000

#: 保留在内存中用于回滚的历史行数。
#: 内存按需分配。负数（实际上）表示无限回滚。
#: 注意，使用非常大的回滚量不推荐，
#: 因为它会降低终端性能并消耗大量 RAM。
#: 建议改用 scrollback_pager_history_size。
#: 注意，重载配置时如果更改此值，
#: 只影响新创建的窗口，不影响现有窗口。

# scrollbar scrolled

#: 控制滚动条何时显示。

#: scrolled（已滚动）
#:     表示开始向后滚动时显示。
#: hovered（悬停）
#:     表示鼠标悬停在窗口右边缘时显示。
#: scrolled-and-hovered（滚动且悬停）
#:     表示鼠标在滚动条区域上*且*已开始向后滚动时显示。
#: always（始终）
#:     表示只要有回滚内容就显示。
#: never（从不）
#:     表示禁用滚动条。

# scrollbar_interactive yes

#: 如果禁用，滚动条将无法通过鼠标控制，
#: 所有鼠标事件将穿透滚动条。

# scrollbar_jump_on_click yes

#: 启用后，点击滚动条轨道将使滚动位置
#: 直接跳转到点击位置，否则滚动位置将
#: 只向点击位置移动一个屏幕的量，
#: 这是传统滚动条的行为方式。

# scrollbar_width 0.5

#: 滚动条的宽度（单位：单元格宽度）。

# scrollbar_hover_width 1

#: 鼠标悬停时滚动条的宽度（单位：单元格宽度）。

# scrollbar_handle_opacity 0.5

#: 滚动条手柄的不透明度，0 为完全透明，
#: 1 为完全不透明。

# scrollbar_radius 0.3

#: 滚动条手柄的圆角半径（单位：单元格宽度）。
#: 应小于 scrollbar_width。

# scrollbar_gap 0.1

#: 滚动条与窗口边缘之间的间隙（单位：单元格宽度）。

# scrollbar_min_handle_height 1

#: 滚动条手柄的最小高度（单位：单元格高度）。
#: 防止回滚内容很多时手柄变得太小。

# scrollbar_hitbox_expansion 0.25

#: 手柄周围的额外点击区域，使抓取滚动条更容易
#: （单位：单元格宽度）。

# scrollbar_track_opacity 0

#: 滚动条轨道的不透明度，0 为完全透明，
#: 1 为完全不透明。

# scrollbar_track_hover_opacity 0.1

#: 鼠标悬停在滚动条上方时轨道的不透明度，
#: 0 为完全透明，1 为完全不透明。

# scrollbar_handle_color foreground

#: 滚动条手柄的颜色。foreground 表示使用
#: 当前前景文本颜色，selection_background 表示
#: 使用当前选中背景色。你也可以使用任意颜色，
#: 如 #12af59 或 red。

# scrollbar_track_color foreground

#: 滚动条轨道的颜色。foreground 表示使用
#: 当前前景文本颜色，selection_background 表示
#: 使用当前选中背景色。你也可以使用任意颜色，
#: 如 #12af59 或 red。

# progress_bar top

#: 当程序使用 OSC 9;4 转义序列报告进度时，
#: 在窗口的指定位置绘制进度条。
#: 进度条使用与滚动条相同的样式和颜色设置。

#: left（左）
#:     在左边缘显示垂直进度条
#: right（右）
#:     在右边缘显示垂直进度条
#: top（上）
#:     在上边缘显示水平进度条
#: bottom（下）
#:     在下边缘显示水平进度条
#: hidden（隐藏）
#:     不显示进度条

# scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

#: 在新窗口中查看回滚缓冲区的程序。
#: 回滚缓冲区通过 STDIN 传递给此程序。
#: 如果你更改它，请确保使用的程序能处理
#: 颜色和文本格式的 ANSI 转义序列。
#: 命令行中的 INPUT_LINE_NUMBER 将被替换为
#: 表示哪一行应位于屏幕顶部的整数。
#: 类似地，CURSOR_LINE 和 CURSOR_COLUMN 将被替换为
#: 当前光标位置，如果没有光标则设为 0，
#: 例如在显示上一个命令输出时。

#: 如果你更想用 neovim 查看回滚，可以使用
#: 类似以下的配置::

#:     scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

#: 以上配置适用于 neovim 0.12 及以上版本。
#: 还有一个专门的插件 kitty-scrollback.nvim
#: <https://github.com/mikesmithgh/kitty-scrollback.nvim>
#: 可以使用，功能更多，也支持旧版 neovim。

# scrollback_pager_history_size 0

#: 单独的回滚历史大小（MB），仅用于
#: 通过分页器浏览回滚缓冲区。这个单独的缓冲区
#: 不能用于交互式滚动，但在单独窗口中
#: 查看回滚缓冲区时会通过管道传给分页器程序。
#: 当前实现以 UTF-8 存储数据，因此对于纯 ASCII
#: 未格式化的文本，每兆字节约 10000 行
#: （每行 100 个字符）。零或更小的值禁用此功能。
#: 最大允许大小是 4GB。注意，重载配置时如果
#: 更改此值，只影响新创建的窗口，不影响现有窗口。

# scrollback_fill_enlarged_window no

#: 放大窗口后，用回滚缓冲区中的行填充新的空间。

# wheel_scroll_multiplier 5.0

#: 鼠标滚轮滚动的行数倍率。
#: 注意，这仅用于低精度滚动设备，
#: 不用于 macOS 和 Wayland 等平台上的高精度滚动设备。
#: 使用负数可改变滚动方向。
#: 另见 wheel_scroll_min_lines。

# wheel_scroll_min_lines 1

#: 鼠标滚轮滚动的最小行数。滚动倍率
#: wheel_scroll_multiplier 只在达到此数字后才生效。
#: 注意，这仅用于低精度滚动设备，
#: 如使用滚轮时滚动量非常小的滚轮鼠标。
#: 使用负数时，最小行数将始终被累加。

# touch_scroll_multiplier 1.0

#: 触摸板滚动的行数倍率。
#: 注意，这仅用于 macOS 和 Wayland 等平台上的高精度滚动设备。
#: 使用负数可改变滚动方向。

# pixel_scroll yes

#: 在使用高精度输入设备（如触摸板）时，
#: 启用 kitty 回滚缓冲区中的逐像素滚动。
#: 启用后，kitty 自身的回滚将以亚行增量移动，
#: 而不仅仅是整行。这不影响在终端内
#: 运行的自行处理滚动的应用程序
#: （例如全屏 TUI 程序）。

# momentum_scroll 0.96

#: 用于减缓惯性（动量）滚动的摩擦力。
#: 0 到 1 之间的数字，0 表示无惯性滚动，
#: 1 表示无限滚动。
#: 注意，此设置仅在 Wayland 等不提供原生惯性
#: 滚动的平台上生效。在 macOS 上，使用
#: 基于原生 OS 的惯性滚动。
#: 此外，惯性滚动仅适用于基于"手指"的设备，
#: 如触摸板和触摸屏。
#: 对此设置的更改只有在重启 kitty 后才会生效。

#: }}}

#: 鼠标 {{{

# mouse_hide_wait 3.0

#: 鼠标在指定秒数未使用后隐藏光标。
#: 设为零禁用鼠标光标隐藏。
#: 设为负值在输入文本时立即隐藏鼠标光标。
#: macOS 上默认禁用，因为要让它在 Cocoa 那
#: 无穷无尽的 bug 海洋中稳定工作实在太费劲了。

#: 默认情况下，光标隐藏后，任何进一步的鼠标事件
#: 都会立即取消隐藏。

#: 支持两种格式：
#:  - <隐藏等待时间>
#:  - <隐藏等待时间> <取消隐藏等待时间> <取消隐藏阈值> <滚动取消隐藏>

#: 要更改取消隐藏行为，可以设置可选参数
#: <取消隐藏等待时间>、<取消隐藏阈值> 和 <滚动取消隐藏>。

#: <取消隐藏等待时间>
#:     在鼠标事件后等待指定秒数才取消隐藏鼠标光标。
#:     设为零在鼠标活动时立即取消隐藏。
#:     这对于防止触控板上的意外滑动导致
#:     鼠标光标取消隐藏很有用。

#: <取消隐藏阈值>
#:     当 <取消隐藏等待时间> 选项非零时，
#:     设置取消隐藏鼠标光标所需的鼠标活动阈值。
#:     当 <取消隐藏等待时间> 为零时，此选项无效。

#:     例如，如果 <取消隐藏阈值> 为 40，
#:     <取消隐藏等待时间> 为 2.5，当 kitty
#:     检测到鼠标事件时，它会在接下来的 2.5 秒内
#:     记录鼠标事件数量，并检查是否超过
#:     40 * 2.5 = 100。如果超过，则取消隐藏鼠标光标，
#:     否则什么都不做。

#: <滚动取消隐藏>
#:     控制哪些鼠标事件可以取消隐藏鼠标光标。
#:     如果启用，滚动和移动事件都可以取消隐藏光标。
#:     如果禁用，只有鼠标移动可以取消隐藏光标。

#: 有效值的例子：
#:  - 0.0
#:  - 1.0
#:  - -1.0
#:  - 0.1 3.0 40 yes

# url_color #0087bd
# url_style curly

#: 鼠标悬停时 URL 高亮的颜色和样式。
#: url_style 可以是: none, straight, double, curly, dotted, dashed。

# open_url_with default

#: 打开点击的 URL 所用的程序。
#: 特殊值 default 会首先查找通过 open_actions
#: <https://sw.kovidgoyal.net/kitty/open_actions/>
#: 定义的 URL 处理程序，如果没有找到，
#: 则使用操作系统的默认 URL 处理程序
#: （macOS 上是 open，Linux 上是 xdg-open）。

# url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh

#: 检测鼠标光标下的 URL 时要查找的 URL 前缀集合。

# detect_urls yes

#: 检测鼠标下的 URL。检测到的 URL 会以
#: 下划线高亮，鼠标光标移到上面时会变成手型。
#: 即使此选项被禁用，URL 仍然可以点击。
#: 另见 underline_hyperlinks 选项，
#: 控制超链接（而非纯文本 URL）的显示方式。

# url_excluded_characters

#: 在检测鼠标光标下的 URL 时，
#: 不允许出现在 URL 中的额外字符。
#: 默认情况下，URL 中合法的所有字符都允许。
#: 此外，换行符是允许的（但会被去除）。
#: 这是为了适应像 mutt 这样的程序，
#: 它们即使对连续行也会添加硬换行。
#: 可以添加 \n 到此选项来禁用此行为。
#: 特殊字符可以使用反斜杠转义指定，
#: 要指定反斜杠本身请使用双反斜杠。

# show_hyperlink_targets never

#: 当鼠标悬停在终端超链接上时，
#: 显示点击超链接时将激活的实际 URL。
#: 设为 ctrl、cmd、alt 或 shift 表示
#: 仅在按下对应修饰键时显示（Ctrl、Super（macOS Cmd）、Shift）。
#: 如果按下多个修饰键，只要配置的修饰键在其中就显示 URL。
#: always 表示始终显示，never 表示从不显示。

# underline_hyperlinks hover

#: 控制超链接的下划线显示方式。
#: 可以是在鼠标悬停时显示下划线 (hover)、
#: 始终保持下划线 (always) 或从不显示 (never)，
#: 即 kitty 不会对超链接应用任何下划线样式。
#: 注意，always 值仅适用于真正的 (OSC 8)
#: 超链接，而不适用于鼠标悬停时检测到的
#: URL 文本。使用 url_style 和 url_color
#: 设置来控制下划线样式。
#: 注意，重载配置并将此值更改为/从 always 更改时，
#: 只影响 kitty 后续接收到的文本。

# copy_on_select no

#: 选中文本时复制到剪贴板或私有缓冲区。
#: 设为 clipboard 时，用鼠标选中文本会将其复制到剪贴板。
#: 在 macOS 等没有"主选择区"概念的平台上很有用。
#: 你也可以指定一个名称（如 a1）来复制到
#: 私有的 kitty 缓冲区。然后映射一个使用
#: paste_from_buffer 操作的快捷键来从这个私有缓冲区粘贴。
#: 例如::

#:     copy_on_select a1
#:     map shift+cmd+v paste_from_buffer a1

#: 注意，复制到剪贴板是一种安全风险，
#: 因为所有程序，包括浏览器中打开的网站，
#: 都可以读取系统剪贴板的内容。

# clear_selection_on_clipboard_loss no

#: 当剪贴板的内容不再反映当前选择时，清除选择。
#: 这主要对 Linux 等平台有用，在这些平台上
#: 选择文本会自动将其复制到特殊的
#: "主选择区"剪贴板，或者当你设置了
#: copy_on_select 为 clipboard 时有用。

#: 注意，在 macOS 上系统不提供剪贴板所有者
#: 更改的通知，所以即使在非 kitty 应用中
#: 复制到剪贴板，也不会清除选择，
#: 即使 copy_on_select 已启用。

# paste_actions quote-urls-at-prompt,confirm

#: 将文本粘贴或拖放到终端时要执行的操作列表，
#: 以逗号分隔。支持的粘贴操作有：

#: quote-urls-at-prompt（在提示符处引用URL）:
#:     如果粘贴的文本是一个 URL 且光标在 shell 提示符处，
#:     自动引用该 URL（需要 shell_integration）。
#: replace-dangerous-control-codes（替换危险控制码）:
#:     替换粘贴文本中的危险控制码，无需确认。
#: replace-newline（替换换行符）:
#:     替换粘贴文本中的换行符，无需确认。
#: confirm（确认）:
#:     如果待粘贴的文本包含任何终端控制码则确认，
#:     因为这可能很危险，如果终端中运行的 shell/程序
#:     没有正确处理这些控制码，可能导致代码执行。
#: confirm-if-large（大文本确认）:
#:     如果粘贴的文本非常大（超过 16KB）则确认，
#:     因为向 shell 粘贴大量文本可能非常慢。
#: filter（过滤）:
#:     对粘贴的文本运行 kitty 配置目录中
#:     paste-actions.py 文件里的 filter_paste() 函数。
#:     函数返回的文本将被实际粘贴。
#: no-op（无操作）:
#:     无效果。

# strip_trailing_spaces never

#: 复制到剪贴板时移除行尾空格。
#: smart 值会在普通选择时移除，但矩形选择时不移除。
#: always 值始终移除。

# select_by_word_characters @-./_~?&=%+#

#: 双击选词时被视为单词一部分的字符。
#: 除了这些字符之外，Unicode 数据库中标记为
#: 字母数字的字符也会被匹配。

# select_by_word_characters_forward

#: 双击后向前扩展选择时被视为单词一部分的字符。
#: 除了这些字符之外，Unicode 数据库中标记为
#: 字母数字的字符也会被匹配。

#: 如果为空（默认），则两个方向都使用
#: select_by_word_characters。

# click_interval -1.0

#: 连续点击之间检测双击/三击的时间间隔（秒）。
#: 负数将改用系统默认值（如果可用），
#: 否则回退到 0.5。

# focus_follows_mouse no

#: 当鼠标移入不同窗口时，将活跃窗口
#: 设为鼠标下的窗口。在单个窗口内移动鼠标时
#: 活跃窗口不会改变，所以意外的鼠标碰撞
#: 不会撤销键盘驱动的窗口切换。
#: 设为 drop 表示仅在窗口内发生拖放时才改变焦点。
#: 在 macOS 上，只要 kitty 应用是活跃应用，
#: 这也会导致鼠标进入 OS 窗口时自动聚焦。

# pointer_shape_when_grabbed arrow

#: 当终端中运行的程序抓取鼠标时，
#: 鼠标指针的形状。

# default_pointer_shape beam

#: 鼠标指针的默认形状。

# pointer_shape_when_dragging beam crosshair

#: 拖拽文本时鼠标指针的默认形状。
#: 可选的第二个值设置在矩形选择模式下拖拽时的形状。

# drag_threshold 5

#: 开始拖放操作前鼠标必须移动的阈值距离。
#: 拖拽适用于标签页和窗口。
#: 你可以拖拽标签页来重新排序、
#: 将它们分离到新的 OS 窗口或移动到另一个 OS 窗口。
#: 类似地，通过拖拽窗口的标题栏
#: （参见 toggle_window_title_bars），
#: 你可以在布局中重新排序窗口、分离窗口
#: 或将其移动到另一个标签页。
#: 值为零时禁用所有拖拽。

#: 注意，在 Wayland 上，由于设计缺陷
#: <https://gitlab.freedesktop.org/wayland/wayland/-/issues/140>，
#: 取消拖拽会分离标签页。
#: 对于支持 xdg-toplevel-drag
#: <https://wayland.app/protocols/xdg-toplevel-drag-v1>
#: 的合成器，此问题已被规避。

#: 鼠标操作 {{{

#: 鼠标按键可以映射以执行任意操作。语法是：

#: .. code-block:: none

#:     mouse_map 按键名称 事件类型 模式 操作

#: 其中 按键名称 是 left、middle、right、
#: b1 ... b8 之一，可附加键盘修饰键。
#: 例如：ctrl+shift+left 表示按住 Ctrl+Shift
#: 键的同时点击鼠标左键。
#: b1 ... b8 可用于指代鼠标上的最多八个按键。

#: 事件类型是 press、release、doublepress、
#: triplepress、click、doubleclick 之一。
#: 模式指示当鼠标被终端中运行的程序抓取时，
#: 还是未被抓取时执行操作。
#: 值为 grabbed 或 ungrabbed 或它们的逗号分隔组合。
#: grabbed 指终端中运行的程序已请求鼠标事件。
#: 注意，click 和 double click 事件
#: 有 click_interval 的延迟以区分双击和三击。

#: 你可以使用 kitty --debug-input 命令行选项
#: 运行 kitty 来查看鼠标事件。
#: 参见下面的内置操作来了解可能的功能。

#: 如果你想取消映射某个按键，将其映射为空。
#: 例如，要禁用普通点击打开 URL::

#:     mouse_map left click ungrabbed

#: 在此处查看所有可映射的操作，包括鼠标操作：
#: <https://sw.kovidgoyal.net/kitty/actions/>。

#: .. note::
#:     一旦选择开始，释放开始选择的按键将自动结束选择，
#:     不会派发释放事件。

# clear_all_mouse_actions no

#: 移除此处之前的所有鼠标操作定义。
#: 例如，用于移除默认鼠标操作。

#: 点击鼠标下的链接或移动光标

# mouse_map left click ungrabbed mouse_handle_click selection link prompt

#::  首先检查是否有选择，如果有则不执行任何操作。
#::  然后检查鼠标光标下是否有链接，如果有则点击它。
#::  最后检查点击是否发生在当前 shell 提示符处，
#::  如果是则将光标移动到点击位置。
#::  注意，这需要 shell 集成
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/> 才能工作。

#: 点击鼠标下的链接或移动光标（即使鼠标被抓取）

# mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt

#::  同上，但即使鼠标被终端中运行的程序抓取，
#::  操作也会执行。

#: 点击鼠标光标下的链接

# mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link

#::  提供 Ctrl+Shift 变体是因为简单的基于点击的
#::  版本有不可避免的 click_interval 延迟，
#::  用于区分单击和双击。

#: 丢弃链接点击的按下事件

# mouse_map ctrl+shift+left press grabbed discard_event

#::  防止此按下事件被发送到抓取鼠标的程序，
#::  因为相应的释放事件用于打开 URL。

#: 从主选择区粘贴

# mouse_map middle release ungrabbed paste_from_selection

#: 开始选择文本

# mouse_map left press ungrabbed mouse_selection normal

#::  如果你想拖放超链接或检测到的 URL，
#::  改用 drag_or_normal_select 代替 normal，
#::  如果鼠标下是超链接，则会基于 drag_threshold
#::  进行拖拽，否则执行普通选择。

#: 开始矩形选择文本

# mouse_map ctrl+alt+left press ungrabbed mouse_selection rectangle

#: 选择一个单词

# mouse_map left doublepress ungrabbed mouse_selection word

#: 选择一行

# mouse_map left triplepress ungrabbed mouse_selection line

#: 从第一个单元格开始选择行

# mouse_map alt+left triplepress ungrabbed mouse_selection line_from_begin

#: 从点击点开始选择行

# mouse_map ctrl+alt+left triplepress ungrabbed mouse_selection line_from_point

#::  从点击点到行尾进行选择。
#::  如果你想先选择点击点的单词，然后扩展到
#::  行的其余部分，将 `line_from_point` 改为
#::  `word_and_line_from_point`。

#: 扩展当前选择

# mouse_map right press ungrabbed mouse_selection extend

#::  如果你只想移动选择的终点而不是最近的边界，
#::  使用 move-end 代替 extend。

#: 使用 shift 扩展当前选择

# mouse_map shift+left press ungrabbed mouse_selection extend

#::  如果你只想移动选择的终点而不是最近的边界，
#::  使用 move-end 代替 extend。

#: 从主选择区粘贴（即使鼠标被抓取）

# mouse_map shift+middle release ungrabbed,grabbed paste_selection
# mouse_map shift+middle press grabbed discard_event

#: 开始选择文本（即使鼠标被抓取）

# mouse_map shift+left press grabbed mouse_selection normal

#: 开始矩形选择文本（即使鼠标被抓取）

# mouse_map ctrl+shift+alt+left press ungrabbed,grabbed mouse_selection rectangle

#: 选择一个单词（即使鼠标被抓取）

# mouse_map shift+left doublepress ungrabbed,grabbed mouse_selection word

#: 选择一行（即使鼠标被抓取）

# mouse_map shift+left triplepress ungrabbed,grabbed mouse_selection line

#: 从第一个单元格选择行（即使鼠标被抓取）

# mouse_map shift+alt+left triplepress ungrabbed,grabbed mouse_selection line_from_begin

#: 从点击点选择行（即使鼠标被抓取）

# mouse_map ctrl+shift+alt+left triplepress ungrabbed,grabbed mouse_selection line_from_point

#::  从点击点到行尾进行选择（即使鼠标被抓取）。
#::  如果你想先选择点击点的单词，然后扩展到
#::  行的其余部分，将 `line_from_point` 改为
#::  `word_and_line_from_point`。

#: 扩展当前选择（即使鼠标被抓取）

# mouse_map shift+right press ungrabbed,grabbed mouse_selection extend

#: 在分页器中显示点击的命令输出

# mouse_map ctrl+shift+right press ungrabbed mouse_show_command_output

#::  需要 shell 集成
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/> 才能工作。

#: }}}

#: }}}

#: 性能调优 {{{

# repaint_delay 10

#: 屏幕更新之间的延迟（毫秒）。降低它可以
#: 提高帧率（FPS），但会增加 CPU 使用。
#: 默认值约 100 FPS，对大多数使用来说绰绰有余。
#: 注意，要实际达到 100 FPS，你必须
#: 要么将 sync_to_monitor 设为 no，
#: 要么使用高刷新率的显示器。
#: 此外，当有待处理的输入需要处理时，
#: 为最小化延迟，此选项会被忽略。

# input_delay 3

#: 处理终端中运行的程序输入前的延迟（毫秒）。
#: 注意，降低它会提高响应速度，
#: 但也会增加 CPU 使用，并可能导致
#: 在每个循环中重绘整个屏幕的全屏程序中
#: 出现闪烁，因为 kitty 太快了，
#: 部分屏幕更新会被绘制出来。
#: 当输入缓冲区几乎满时，此设置被忽略。

# sync_to_monitor yes

#: 将屏幕更新同步到显示器的刷新率。
#: 这可以防止滚动时出现屏幕撕裂
#: <https://en.wikipedia.org/wiki/Screen_tearing>。
#: 但它会将渲染速度限制在显示器的刷新率。
#: 使用非常高速的鼠标/高键盘重复率时，
#: 你可能会注意到一些轻微的输入延迟。
#: 如果有这种情况，将此选项设为 no。

#: }}}

#: 终端响铃 {{{

enable_audio_bell no

#: 音频响铃。在需要安静的环境中可禁用它。

# visual_bell_duration 0.0

#: 视觉响铃持续时间（秒）。当响铃发生时，
#: 屏幕闪烁指定的秒数。设为零禁用。
#: 闪烁是动画的，在指定持续时间内淡入淡出。
#: 可以控制淡入淡出使用的缓动函数。
#: 例如，2.0 linear 将使闪烁线性淡入淡出。
#: 如果未指定，默认使用 ease-in-out，
#: 在开始、中间和结束时缓慢淡出。
#: 你可以为淡入和淡出部分指定不同的缓动函数，
#: 像这样：2.0 ease-in linear。
#: kitty 支持所有 CSS 缓动函数
#: <https://developer.mozilla.org/en-US/docs/Web/CSS/easing-function>。

# visual_bell_color none

#: 视觉响铃使用的颜色。设为 none 将回退到
#: 选择背景色。如果你觉得视觉响铃太亮，
#: 可以将其设为较暗的颜色。

# window_alert_on_bell yes

#: 响铃时请求窗口注意。
#: 在 macOS 上使 Dock 图标弹跳，在 Linux 上使任务栏闪烁。

# bell_on_tab "🔔 "

#: 当标签页中有未获得焦点的窗口发生响铃时，
#: 在标签上显示的一些文本或 Unicode 符号。
#: 如果你想使用前导或尾随空格，请用引号将文本括起来。
#: 参见 tab_title_template 了解如何渲染。

#: 为了向后兼容，yes、y 和 true 值会被
#: 转换为默认的响铃符号，
#: no、n、false 和 none 会被转换为空字符串。

# command_on_bell none

#: 响铃发生时运行的程序。
#: 环境变量 KITTY_CHILD_CMDLINE 可用于获取
#: 发生响铃的窗口中运行的程序。

# macos_dock_badge_on_bell yes

#: 当 kitty 不是活跃应用时，
#: 响铃时在 kitty 的 Dock 图标上显示徽章（仅 macOS）。
#: 当 kitty 重新获得焦点时，徽章会自动清除。

# bell_path none

#: 作为响铃声音播放的声音文件路径。
#: 如果设为 none，使用系统默认的响铃声音。
#: 必须是操作系统声音 API 支持的格式，
#: 如 Linux（libcanberra）上的 WAV 或 OGA，
#: 或 macOS（NSSound）上的 AIFF、MP3 或 WAV。
#: 相对路径相对于 kitty 配置目录解析。

# linux_bell_theme __custom

#: kitty 用于播放响铃声音的 XDG 声音主题。
#: 在 Wayland 上，当合成器支持时，
#: 会请求合成器播放系统默认响铃声音，
#: 此设置无效。注意，Hyprland 声称支持
#: 此协议，但实际上不会播放声音
#: <https://github.com/hyprwm/Hyprland/issues/10488>。
#: 此设置默认为 XDG 声音主题规范中指定的
#: 自定义主题名称，如果不存在则回退到
#: 默认的 freedesktop 主题。
#: 要更改桌面范围的声音主题，创建
#: :file:`~/.local/share/sounds/__custom/index.theme`
#: 文件，内容如下：

#:     [Sound Theme]

#:     Inherits=你想要使用的声音主题名称

#: 将 Inherits 的值替换为实际的主题名称。
#: 现在所有兼容的应用程序都应使用此主题的声音。

#: }}}

#: 窗口布局 {{{

# remember_window_size  yes
# initial_window_width  640
# initial_window_height 400

#: 如果启用，OS 窗口大小将被记住，
#: 以便 kitty 新实例具有与上一实例相同的大小。
#: 如果禁用，OS 窗口初始大小将由
#: initial_window_width/height 配置（以像素为单位）。
#: 你可以在宽/高值后使用 "c" 后缀，
#: 将其解释为单元格数而非像素。

# remember_window_position no

#: 如果启用，OS 窗口位置将被记住，
#: 以便 kitty 新实例具有与上一实例相同的位置。
#: 如果禁用，OS 窗口将由窗口管理器放置。
#: 注意，记住位置仅在底层桌面环境/
#: 窗口管理器支持时有效。在 Wayland 上永远无效。
#: 另见 kitty --position 在启动 kitty 时指定位置。

# enabled_layouts *

#: 启用的窗口布局。以逗号分隔的布局名称列表。
#: 特殊值 all 表示所有布局。
#: 第一个列出的布局将用作启动布局。
#: 默认配置是所有布局按字母顺序排列。
#: 可用布局列表请参见
#: <https://sw.kovidgoyal.net/kitty/overview/#layouts>。

# window_resize_step_cells 2
# window_resize_step_lines 2

#: 在布局中使用 start_resizing_window 快捷键
#: 调整 kitty 窗口大小时使用的步长
#: （单位：单元格宽度/单元格高度）。
#: cells 值用于水平调整，
#: lines 值用于垂直调整。

# window_border_width 0.5pt

#: 窗口边框的宽度。可以是像素 (px) 或磅 (pt)。
#: 以 pt 为单位的值会根据屏幕分辨率
#: 四舍五入到最接近的像素数。
#: 如果未指定，默认单位是 pt。
#: 注意，边框仅在多个窗口可见时显示。
#: 它们用于分隔多个窗口。

# draw_minimal_borders yes

#: 仅绘制最小必要边框。
#: 这意味着只绘制将窗口与邻居分隔的边框。
#: 注意，设置非零的 window_margin_width 会覆盖此设置，
#: 并导致绘制所有边框。

# draw_window_borders_for_single_window no

#: 即使只有一个窗口可见时也围绕窗口绘制边框。
#: 启用后且只有一个窗口时，
#: 会在其周围绘制完整边框
#: （就像 draw_minimal_borders 为 false）。
#: 当窗口聚焦且 OS 窗口聚焦时边框显示活跃颜色，
#: 当 OS 窗口失去焦点时显示非活跃颜色。
#: 这提供了 kitty 窗口是否聚焦的清晰视觉指示。
#: 当有多个窗口可见时，此选项无效，
#: 适用正常的边框绘制规则。

# window_margin_width 0

#: 窗口外边距（磅/pt）（边框外的空白区域）。
#: 单个值设置所有四边。
#: 两个值设置垂直和水平边。
#: 三个值设置上、水平和下边。
#: 四个值设置上、右、下、左边。

# single_window_margin_width -1

#: 仅单个窗口可见时使用的窗口外边距（磅/pt）。
#: 负值将改用 window_margin_width 的值。
#: 单个值设置所有四边。
#: 两个值设置垂直和水平边。
#: 三个值设置上、水平和下边。
#: 四个值设置上、右、下、左边。

# window_padding_width 0

#: 窗口内边距（磅/pt）（文本和窗口边框之间的空白区域）。
#: 单个值设置所有四边。
#: 两个值设置垂直和水平边。
#: 三个值设置上、水平和下边。
#: 四个值设置上、右、下、左边。

# single_window_padding_width -1

#: 仅单个窗口可见时使用的窗口内边距（磅/pt）。
#: 负值将改用 window_padding_width 的值。
#: 单个值设置所有四边。
#: 两个值设置垂直和水平边。
#: 三个值设置上、水平和下边。
#: 四个值设置上、右、下、左边。

# placement_strategy center

#: 当窗口大小不是单元格大小的精确整数倍时，
#: 终端窗口的单元格区域在两侧会有一些额外内边距。
#: 你可以通过此选项控制这些内边距的分布方式。
#: 使用 center 值表示单元格区域将居中放置。
#: 使用 top-left 值表示内边距将仅在底部和右侧。
#: 值可以是：top-left, top, top-right, left, center,
#: right, bottom-left, bottom, bottom-right 之一。

# active_border_color #00ff00

#: 活跃窗口边框的颜色。设此为 none
#: 将不在活跃窗口周围绘制边框。

# inactive_border_color #cccccc

#: 非活跃窗口边框的颜色。

# bell_border_color #ff5a00

#: 发生响铃的非活跃窗口边框的颜色。

# inactive_text_alpha 1.0

#: 按指定量淡化非活跃窗口中的文本。
#: 必须是 -1 到 1 之间的数字。
#: 绝对值控制实际不透明度，
#: 零表示完全淡化，一表示完全不透明。
#: 当使用正数时，即使只有一个窗口可见，
#: 只要 OS 窗口未聚焦，文本就会被淡化。
#: 负数表示仅在 OS 窗口中有多个 kitty 窗口
#: 可见时才淡化文本。
#: 淡化发生在除活跃窗口之外的所有窗口中，
#: 即使 OS 窗口未聚焦。
#: 因此，如果你希望依赖窗口管理器来指示
#: OS 窗口焦点，而使用此功能来指示 OS 窗口中
#: 哪个 kitty 窗口是活跃的，这很有用。

hide_window_decorations titlebar-only
# hide_window_decorations titlebar-and-corners

#: 使用 yes 隐藏窗口装饰（标题栏和窗口边框）。
#: 在 macOS 上，可以使用 titlebar-only 和
#: titlebar-and-corners 来仅隐藏标题栏和圆角。

#: 在 Wayland 上，titlebar-only 可用于隐藏标题栏，
#: 同时保留窗口阴影用于调整大小。
#: 在具有服务器端装饰的合成器上
#: （如除 GNOME 之外的任何合成器），
#: yes 和 titlebar-only 都会强制使用客户端装饰模式。

#: 这是否有效以及具体效果取决于
#: 窗口管理器/操作系统。
#: 注意，重载配置时更改此选项的效果是未定义的。
#: 在 macOS 上使用 titlebar-only 时，
#: 建议同时设置 window_margin_width 和
#: placement_strategy 以防止圆角裁剪文本。
#: 或使用 titlebar-and-corners。

# window_logo_path none

#: Logo 图片的路径。必须是 PNG/JPEG/WEBP/GIF/TIFF/BMP 格式。
#: 相对路径相对于 kitty 配置目录解释。
#: Logo 显示在每个 kitty 窗口的一个角落。
#: 位置由 window_logo_position 控制。
#: 可以使用 launch 操作或远程控制
#: <https://sw.kovidgoyal.net/kitty/remote-control/>
#: 为各个窗口配置不同的 Logo。

# window_logo_position bottom-right

#: 窗口 Logo 在窗口中的位置。
#: 值可以是：top-left, top, top-right, left,
#: center, right, bottom-left, bottom, bottom-right 之一。

# window_logo_alpha 0.5

#: Logo 淡入背景的程度。
#: 零表示完全淡化，一表示完全不透明。

# window_logo_scale 0

#: Logo 应缩放到窗口大小的百分比 (0-100]。
#: 使用单个数字表示 Logo 缩放到最短窗口
#: 维度的该百分比，同时保持 Logo 图片的宽高比。

#: 使用两个数字表示 Logo 的宽度和高度
#: 分别缩放到窗口宽度和高度的相应百分比。

#: 使用零作为百分比禁用该维度的缩放。
#: 单个零（默认值）禁用窗口 Logo 的所有缩放。

# resize_debounce_time 0.1 0.5

#: 在 OS 窗口实时调整大小期间，
#: 当没有新的 resize 事件收到后，
#: 即调整大小暂停或完成时，
#: 等待多长时间（秒）再要求终端中运行的程序
#: 调整大小并重绘屏幕。
#: 在 macOS 等平台上，操作系统发送对应
#: 实时调整大小开始和结束的事件，
#: 第二个数字用于暂停后的重绘，
#: 因为 kitty 可以区分暂停和调整大小结束。
#: 在此类系统上，第一个数字被忽略，
#: 调整大小结束后立即重绘。
#: 在其他系统上，只使用第一个数字，
#: 以便 kitty 在调整大小结束后快速"就绪"，
#: 同时不持续重绘以节省能源。

# resize_in_steps no

#: 按单元格大小的步长调整 OS 窗口，
#: 而不是通常的像素精度。
#: 结合使用以单元格数量为单位的
#: initial_window_width 和 initial_window_height，
#: 此选项可用于在调整 OS 窗口大小时
#: 保持边距尽可能小。
#: 注意，当前在 Wayland 上不工作。

# visual_window_select_characters 1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ

#: 可视化窗口选择的字符列表。
#: 例如，用于 focus_visible_window 选择要聚焦的窗口。
#: 值应是一系列不重复的数字或字母，不区分大小写，
#: 来自 0-9A-Z\-=[];',./\\` 这个集合。
#: 用一串字符指定你的偏好。

# confirm_os_window_close -1

#: 当通过窗口管理器关闭 OS 窗口或标签页时
#: （例如点击窗口关闭按钮或按操作系统快捷键关闭窗口）
#: 或通过 close_tab 操作关闭时，
#: 如果其中至少有此数量的 kitty 窗口，则请求确认。
#: 值为零时禁用确认。
#: 此确认也适用于退出整个应用程序的请求
#: （所有 OS 窗口，通过 quit 操作）。
#: 负值会转换为正值，但是如果启用了
#: shell_integration，使用负值表示
#: 位于 shell 提示符处的窗口不计入，
#: 只计入当前有命令正在运行的窗口。
#: 你也可以通过添加 count-background 到设置中，
#: 让后台作业阻止关闭，例如：-1 count-background。
#: 注意，如果你想在关闭单个窗口时确认，
#: 可以映射 close_window_with_confirmation 操作。

# window_drag_tolerance 2

#: 控制拖拽窗口边框以调整 kitty 窗口大小。
#: 这是窗口边框周围区域的容差（磅/pt），
#: 在该区域内按下鼠标左键将开始拖拽窗口边框。
#: 使用大的负值（如 -200）来禁用边框拖拽。
#: 注意，由于 kitty 使用布局，
#: 拖拽边框实际上不会调整窗口本身的大小，
#: 而是调整布局的行/列/槽的大小，
#: 这可能导致多个窗口被调整大小。

# window_title_bar top

#: 控制窗口标题栏相对于窗口内容的位置。
#: 使用 window_title_bar_min_windows 控制
#: 何时显示标题栏。
#: 使用 window_title_template 格式化显示
#: 的窗口标题。

# window_title_bar_min_windows 0

#: 在显示窗口标题栏之前标签页中必须有的
#: 最少可见窗口数。
#: 值为 0 表示从不显示。1 表示始终显示。
#: 2 或更多表示仅当至少有那么多窗口可见时才显示。
#: 类似于标签栏的 tab_bar_min_tabs。

# window_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.window}{progress_percent}{title}"

#: 渲染窗口标题栏文本的模板。
#: 使用与 tab_title_template 相同的模板语法。
#: 可用变量包括：{title}、{bell_symbol}、
#: {activity_symbol}、{progress_percent}、
#: {custom}、{fmt}、{is_active}。
#: 你还可以在 kitty 配置目录的
#: window_title_bar.py 中提供自定义的
#: draw_window_title(data) 函数，通过 {custom} 暴露。

# active_window_title_template none

#: 活跃窗口标题栏使用的模板。
#: 如果未设置（值为 none），则使用 window_title_template。

# window_title_bar_active_foreground none

#: 活跃窗口标题栏的前景色。
#: 设为 none 时默认为相应的标签栏颜色
#: （active_tab_foreground）。

# window_title_bar_active_background none

#: 活跃窗口标题栏的背景色。
#: 设为 none 时默认为相应的标签栏颜色
#: （active_tab_background）。

# window_title_bar_inactive_foreground none

#: 非活跃窗口标题栏的前景色。
#: 设为 none 时默认为相应的标签栏颜色
#: （inactive_tab_foreground）。

# window_title_bar_inactive_background none

#: 非活跃窗口标题栏的背景色。
#: 设为 none 时默认为相应的标签栏颜色
#: （inactive_tab_background）。

# window_title_bar_align center

#: 窗口标题栏中文本的水平对齐方式。

#: }}}

#: 标签栏 {{{

# tab_bar_edge bottom

#: 标签栏显示在哪个边缘，top（顶部）或 bottom（底部）。

# tab_bar_margin_width 0.0

#: 标签栏左右两侧的外边距（磅/pt）。

# tab_bar_margin_height 0.0 0.0

#: 标签栏上下方的外边距（磅/pt）。
#: 第一个数字是 OS 窗口边缘与标签栏之间的边距。
#: 第二个数字是标签栏与当前标签内容之间的边距。

tab_bar_style custom

#: 标签栏样式，可以是以下之一：

#: fade（渐隐）
#:     每个标签的边缘渐隐到背景色（另见 tab_fade）
#: slant（斜角）
#:     标签看起来像实体文件夹的标签
#: separator（分隔符）
#:     标签由可配置的分隔符分隔（另见 tab_separator）
#: powerline
#:     标签显示为带有花式分隔符的连续线
#:     （另见 tab_powerline_style）
#: custom（自定义）
#:     从 kitty 配置目录的 tab_bar.py 文件中
#:     加载用户提供的 Python 函数 draw_tab。
#:     关于如何编写此类函数的示例，
#:     请参见 kitty 源代码中以 draw_tab_with_*
#:     命名的函数：kitty/tab_bar.py。
#:     另见此讨论
#:     <https://github.com/kovidgoyal/kitty/discussions/4447>
#:     获取 kitty 用户的示例。
#: hidden（隐藏）
#:     标签栏被隐藏。如果使用此选项，你可能想
#:     为 select_tab 操作创建映射，
#:     它会显示标签列表并允许轻松切换标签。

# tab_bar_filter

#: 搜索表达式
#: <https://sw.kovidgoyal.net/kitty/remote-control/#search-syntax>。
#: 只有匹配此表达式的标签才会在标签栏中显示。
#: 当前活跃标签始终显示，无论是否匹配。
#: 使用此选项时，标签栏显示的标签数
#: 可能少于 tab_bar_min_tabs 中指定的数量，
#: 因为评估过滤器的成本很高，只在显示时进行。
#: 这在配合 sessions
#: <https://sw.kovidgoyal.net/kitty/sessions/> 使用时最有用。
#: 表达式 session:~ 或 session:^$ 将只显示
#: 属于当前会话或无会话的标签。
#: 各种标签导航操作如 goto_tab、next_tab、
#: previous_tab 等会自动限制为只作用于匹配的标签。

# tab_bar_align left

#: 标签栏的水平对齐方式，可以是：
#: left（左）、center（中）、right（右）。

# tab_bar_show_new_tab_button no

#: 设为 yes 时，在标签栏末尾始终显示一个 + 按钮，
#: 作为打开新标签的可点击快捷方式。
#: 设为 no（默认值）时，按钮在静止状态下隐藏，
#: 但在窗口被拖拽时暂时显示，
#: 因此它可以用作拖放目标，在新标签中打开窗口。

# tab_bar_min_tabs 2

#: 显示标签栏所需的最小标签数。

# tab_switch_strategy previous

#: 当前标签关闭时切换标签的算法。
#: 默认的 previous 将切换到上次使用的标签。
#: left 值将切换到关闭标签左侧的标签。
#: right 值将切换到关闭标签右侧的标签。
#: last 值将切换到最右侧的标签。

# tab_fade 0.25 0.5 0.75 1

#: 当 tab_bar_style 为 fade 时，
#: 控制每个标签如何渐隐到背景中。
#: 每个数字是一个 alpha 值（0 到 1），
#: 控制对应单元格渐隐到背景的程度，
#: 0 表示无渐隐，1 表示完全渐隐。
#: 你可以通过添加/删除此列表中的条目
#: 来更改使用的单元格数量。

# tab_separator " ┇"

#: 当 tab_bar_style 为 separator 时，
#: 标签栏中标签之间的分隔符。

# tab_powerline_style angled

#: 当 tab_bar_style 为 powerline 时，
#: 标签栏中标签之间的 powerline 分隔符样式，
#: 可以是：angled（斜角）、slanted（倾斜）、round（圆形）。

# tab_activity_symbol none

#: 当标签页中有未获得焦点的窗口
#: 有活动时，在标签上显示的文本或 Unicode 符号。
#: 如果你想使用前导或尾随空格，
#: 请用引号将文本括起来。
#: 参见 tab_title_template 了解如何渲染。

# tab_title_max_length 0

#: 可用于渲染标签文本的最大单元格数。
#: 值为零表示不应用任何限制。

# tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}"

#: 渲染标签标题的模板。
#: 默认仅渲染标题，附带有响铃和活动的可选符号。
#: 如果你希望也包含标签索引，使用类似：
#: {index}:{title} 的格式。
#: 如果你有映射到 goto_tab N 的快捷键，
#: 这会很有用。如果你更喜欢将索引显示为
#: 上标，使用 {sup.index}。所有可用数据如下：

#: title（标题）
#:     当前标签标题
#: index（索引）
#:     可用于 goto_tab N 快捷键的标签索引
#: layout_name（布局名称）
#:     当前布局名称
#: session_name（会话名称）
#:     创建此标签的 kitty 会话文件的名称（如果有）
#: active_session_name（活跃会话名称）
#:     创建此标签中活跃窗口的 kitty 会话文件的名称（如果有）
#: num_windows（窗口数量）
#:     标签中的窗口数量
#: num_window_groups（窗口组数量）
#:     标签中的窗口组数量（窗口组是一个窗口及其所有覆盖窗口）
#: tab.active_wd（活跃工作目录）
#:     标签中当前活跃窗口的工作目录
#:     （开销较大，需要系统调用）。
#:     使用 tab.active_oldest_wd 获取
#:     最旧的前台进程的目录，而非最新的。
#: tab.active_exe（活跃可执行文件）
#:     标签中当前活跃窗口前台运行的可执行文件名称
#:     （开销较大，需要系统调用）。
#:     使用 tab.active_oldest_exe 获取最旧的前台进程。
#: max_title_length（最大标题长度）
#:     可用的最大标题长度
#: keyboard_mode（键盘模式）
#:     当前键盘模式的名称
#:     <https://sw.kovidgoyal.net/kitty/mapping/#modal-mappings>
#:     如果没有活跃的键盘模式则为空字符串
#: tab.last_focused_progress_percent
#:     如果窗口中运行的命令报告了任务进度，
#:     显示标签中最近聚焦窗口的进度百分比。
#:     如果没有进度报告则为空字符串
#: tab.progress_percent
#:     如果窗口中运行的命令报告了任务进度，
#:     显示标签中所有窗口的平均进度百分比。
#:     如果没有进度报告则为空字符串
#: custom（自定义）
#:     这会调用 kitty 配置目录中 tab_bar.py 文件
#:     里名为 draw_title(data) 的函数。
#:     函数接收一个数据字典，与模板中可用的数据相同。
#:     然后执行任意复杂的处理并返回字符串。
#:     例如：tab_title_template "{custom}"
#:     将使用函数的输出作为标签标题。
#:     draw_title() 中的任何 print 语句
#:     将输出到 kitty 进程的 STDOUT，便于调试。

#: 注意，格式化由 Python 的字符串格式化
#: 机制完成，因此你可以使用例如
#: {layout_name[:2].upper()} 来仅显示
#: 布局名称的前两个字母（大写）。
#: 如果你想为文本设置样式，可以使用样式指令，
#: 例如：
#: `{fmt.fg.red}红色{fmt.fg.tab}正常{fmt.bg._00FF00}绿色背景{fmt.bg.tab}`。
#: 类似地，对于粗体和斜体：
#: `{fmt.bold}粗体{fmt.nobold}正常{fmt.italic}斜体{fmt.noitalic}`。
#: 256 种八色终端颜色可以使用
#: `fmt.fg.color0` 到 `fmt.fg.color255`。
#: 注意，为了向后兼容，如果模板中不存在
#: {bell_symbol} 或 {activity_symbol}，
#: 它们会被添加到模板之前。

# active_tab_title_template none

#: 活跃标签使用的模板。
#: 如果未指定，回退到 tab_title_template。

# active_tab_foreground   #000
# active_tab_background   #eee
# active_tab_font_style   bold-italic
# inactive_tab_foreground #444
# inactive_tab_background #999
# inactive_tab_font_style normal

#: 标签栏的颜色和样式
#: （活跃标签前景色/背景色/字体样式、
#: 非活跃标签前景色/背景色/字体样式）。

# tab_bar_background none

#: 标签栏的背景色。
#: 默认为使用终端背景色。

# tab_bar_margin_color none

#: 标签栏外边距区域的颜色。
#: 对于标签栏上方和下方的外边距，
#: 默认使用终端背景色。
#: 对于侧边外边距，默认颜色选择为与相邻标签的
#: 背景色匹配，除非窗口是半透明的，
#: 此时使用默认背景色看起来更好。

#: }}}

#: 配色方案 {{{

# foreground #dddddd
# background #000000

#: 前景色和背景色。

# background_opacity 1.0

#: 终端背景色的不透明度。
#: 0 到 1 之间的数字，1 为完全不透明，0 为完全透明。
#: 仅在操作系统支持时有效
#: （例如，在 X11 下使用合成器时）。
#: 注意，它仅设置具有与默认终端背景相同背景色
#: 的单元格的背景色不透明度，
#: 这样 vim 中的状态栏、powerline 提示符等
#: 仍然看起来不错。但这也意味着如果你在编辑器
#: 中使用带背景色的颜色主题，它将不会渲染为透明。
#: 你应该在 kitty 配置中更改默认背景色，
#: 而不是在编辑器配色方案中使用背景色。
#: 或者使用转义码在 shell 脚本中设置终端默认颜色
#: 来启动编辑器。
#: 另见 transparent_background_colors。
#: 请注意，使用小于 1.0 的值会带来
#: （可能是显著的）性能损失。
#: 当为此设置使用较低的值时，
#: 建议将背景色设置为与桌面背景
#: 总体颜色匹配的颜色，以获得最佳文本渲染效果。
#: 还要注意，此设置不适用于 background_image
#: （如果有的话）。背景图片本身可以通过
#: alpha 通道具有透明度，如果需要的话，
#: 这会得到尊重。

#: 如果你想动态更改窗口的透明度，
#: 将 dynamic_background_opacity 设为 yes
#: （默认是关闭的，因为有性能成本）。
#: 重载配置时更改此选项仅在原始配置中
#: dynamic_background_opacity 已启用时才有效。

# background_blur 0

#: 设为正值以在支持此功能的平台上
#: 启用背景模糊（模糊透明窗口后面的视觉效果）。
#: 仅在 background_opacity 小于 1 时生效。
#: 在 macOS 上，这也将控制模糊半径（模糊程度）。
#: 设置过高的值会导致严重的性能问题和/或渲染瑕疵。
#: 通常，值最大到 64 都能正常工作。
#: 注意，这可能会导致性能问题，取决于平台
#: 如何实现，请谨慎使用。
#: 当前支持 macOS 和 Wayland
#: （当合成器支持背景模糊扩展时）。

# transparent_background_colors

#: 最多 7 个颜色的空格分隔列表，带不透明度。
#: 当单元格的背景色匹配这些颜色之一时，
#: 将使用指定的不透明度渲染为半透明。

#: 在更复杂的 UI（如编辑器）中很有用，
#: 你可能希望不止一种背景色被渲染为透明，
#: 例如光标高亮行背景或高亮块。
#: 终端应用程序可以使用 kitty 颜色控制
#: <https://sw.kovidgoyal.net/kitty/color-stack/#color-control>
#: 转义码来设置此颜色。

#: 指定颜色的语法是：color@opacity，
#: @opacity 部分是可选的。未指定时，
#: 使用 background_opacity 的值。例如::

#:     transparent_background_colors red@0.5 #00ff00@0.3

#: 注意，你还必须将 background_opacity 设为
#: 小于 1 的值，此设置才能正常工作。

# dynamic_background_opacity no

#: 允许使用键盘快捷键
#: （increase_background_opacity 和
#: decrease_background_opacity）或远程控制
#: 动态更改 background_opacity。
#: 不支持通过重载配置来更改此选项。

# background_image none

#: 匹配一个或多个背景图片的 glob 模式。
#: 必须是 PNG/JPEG/WEBP/TIFF/GIF/BMP 格式。
#: 第一张用作默认图片。
#: 多张图片存储在 GPU VRAM 中（按需），
#: 以便在它们之间即时切换。
#: 要在背景图片列表中的图片之间切换，
#: 使用远程控制命令 set-background-image，
#: 详见 `kitten set-background-image --help`。
#: 你可以将命令映射到按键，例如：
#: map f1 remote_control set-background-image +1。
#: 注意，当使用 auto_color_scheme
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 时，此选项被配色方案文件覆盖，
#: 必须在其中设置才能生效。

# background_image_layout tiled

#: 背景图片是平铺、缩放还是钳制。
#: 值可以是 tiled（平铺）、mirror-tiled（镜像平铺）、
#: scaled（缩放）、clamped（钳制）、centered（居中）
#: 或 cscaled（等比缩放）之一。
#: scaled 和 cscaled 值将图片缩放到窗口大小，
#: cscaled 保留图片宽高比。
#: 注意，当使用 auto_color_scheme 时，
#: 此选项被配色方案文件覆盖，必须在其中设置才能生效。

# background_image_linear no

#: 当背景图片被缩放时，是否应使用
#: 线性插值。注意，当使用 auto_color_scheme 时，
#: 此选项被配色方案文件覆盖，必须在其中设置才能生效。

# background_tint 0.0

#: 用背景色给背景图片着色的程度。
#: 此选项使文本更易于阅读。
#: 着色使用每个窗口的当前背景色。
#: 此选项仅在设置 background_image 时适用。
#: 注意，当使用 auto_color_scheme 时，
#: 此选项被配色方案文件覆盖，必须在其中设置才能生效。

# background_tint_gaps 1.0

#: 应用 background_tint 后，在窗口间隙处
#: 用背景色给背景图片着色的程度。
#: 由于此值与 background_tint 是乘法关系，
#: 可用于在窗口间隙处减轻着色，
#: 以实现"分离"的外观效果。
#: 注意，当使用 auto_color_scheme 时，
#: 此选项被配色方案文件覆盖，必须在其中设置才能生效。

# dim_opacity 0.4

#: 设置了 DIM/FAINT 属性的文本的淡化程度。
#: 1 表示不淡化，0 表示完全淡化（即不可见）。

# selection_foreground #000000
# selection_background #fffacd

#: 用鼠标选中的文本的前景色和背景色。
#: 将两者都设为 none 将对选择产生"反色"效果，
#: 选择的颜色将是单元格文本色，
#: 文本将变为单元格背景色。
#: 仅将 selection_foreground 设为 none
#: 将保留前景色不变。
#: 注意，这些颜色可以被终端中运行的程序覆盖。

# palette_generate fixed

#: 如何填充 256 色调色板中
#: 任何未设置（设为 none）的颜色。
#: 默认情况下，为了历史兼容性，
#: 这些颜色被设为历史上终端使用的固定值集合。

#: 改为让 kitty 基于前 16 种颜色生成它们
#: <https://gist.github.com/jake-stewart/0a8ea46159a7da2c808e5be2177e1783>。

#: semantic 值使用一种在浅色主题中
#: 具有良好可读性但会改变某些颜色含义的算法
#: （与固定颜色编码相比）。
#: legacy 值在浅色主题中可读性较差，
#: 但与固定颜色编码的偏差较小。

#: 颜色表 {{{

#: 256 种终端颜色。有 8 种基本颜色，
#: 每种颜色有暗淡和明亮版本，构成前 16 种颜色。
#: 你可以将剩余的 240 种颜色设置为 color16 到 color255。

# color0 #000000
# color8 #767676
#: 黑色

# color1 #cc0403
# color9 #f2201f
#: 红色

# color2  #19cb00
# color10 #23fd00
#: 绿色

# color3  #cecb00
# color11 #fffd00
#: 黄色

# color4  #0d73cc
# color12 #1a8fff
#: 蓝色

# color5  #cb1ed1
# color13 #fd28ff
#: 品红

# color6  #0dcdcd
# color14 #14ffff
#: 青色

# color7  #dddddd
# color15 #ffffff
#: 白色

# mark1_foreground black
#: 类型 1 标记的颜色

# mark1_background #98d3cb
#: 类型 1 标记的颜色（浅钢蓝）

# mark2_foreground black
#: 类型 2 标记的颜色

# mark2_background #f2dcd3
#: 类型 2 标记的颜色（米色）

# mark3_foreground black
#: 类型 3 标记的颜色

# mark3_background #f274bc
#: 类型 3 标记的颜色（紫罗兰）

#: }}}

#: 广色域颜色格式 {{{

#: kitty 支持现代广色域颜色格式，包括 OKLCH
#: 和 CIE LAB，用于精确的颜色指定。
#: 这些格式可以在任何接受颜色值的地方使用
#: （foreground、background、color0-color255 等）。

#: 有关广色域颜色格式的详细文档、语法和示例，
#: 请参见 /wide-gamut-colors
#: <https://sw.kovidgoyal.net/kitty/wide-gamut-colors/>。

#: }}}

#: }}}

#: 高级设置 {{{

# shell .

#: 要执行的 shell 程序。
#: 默认值 . 表示使用 SHELL 环境变量的值，
#: 如果未设置，则使用当前用户默认的 shell。
#: 注意，在 macOS 上如果你更改了此设置，
#: 可能需要添加 --login 和 --interactive
#: 以确保 shell 以交互模式启动并读取其启动 rc 文件。
#: 此设置中的环境变量会被展开。

# editor .

#: 在编辑 kitty 配置文件或类似任务时
#: 使用的基于终端的文本编辑器（如 vim 或 nano）。

#: 默认值 . 表示按顺序使用环境变量
#: VISUAL 和 EDITOR。如果这些变量未设置，
#: kitty 将运行你的 shell（$SHELL -l -i -c env）
#: 来查看你的 shell 启动 rc 文件是否设置了
#: VISUAL 或 EDITOR。如果还是不行，
#: kitty 将遍历各种已知编辑器
#: （vim、emacs 等），取系统中存在的第一个。

# close_on_child_death no

#: 当子进程（通常是 shell）退出时关闭窗口。
#: 默认值 no 表示即使子进程退出，
#: 只要仍有其他进程在向终端输出
#: （例如脱离的或后台的进程），终端将保持打开。
#: 启用 yes 后，窗口将在子进程退出时立即关闭。
#: 注意，设为 yes 意味着任何仍在
#: 使用终端的后台进程可能会静默失败，
#: 因为它们的 stdout/stderr/stdin 不再有效。

# remote_control_password

#: 允许其他程序使用密码控制 kitty。
#: 此选项可以多次指定以添加多个密码。
#: 如果没有密码存在，当程序尝试使用密码
#: 进行远程控制时，kitty 将请求用户许可。
#: 密码还可以*可选地*与一组允许的远程控制操作
#: 关联。例如::

#:     remote_control_password "my passphrase" get-colors set-colors focus-window focus-tab

#: 只有指定的操作在使用此密码时才被允许。
#: 也可以使用 glob 模式，例如::

#:     remote_control_password "my passphrase" set-tab-* resize-*

#: 要获取可用操作的列表，运行::

#:     kitten @ --help

#: 当不发送密码时允许的一组操作
#: 可以通过使用空密码来指定。例如::

#:     remote_control_password "" *-colors

#: 最后，可以指定一个 Python 模块的路径，
#: 该模块提供 is_cmd_allowed 函数，
#: 用于检查每个远程控制命令。例如::

#:     remote_control_password "my passphrase" my_rc_command_checker.py

#: 相对路径从 kitty 配置目录解析。
#: 详见 rc_custom_auth
#: <https://sw.kovidgoyal.net/kitty/remote-control/#rc-custom-auth>。

# allow_remote_control no

#: 允许其他程序控制 kitty。
#: 如果你开启此选项，其他程序可以控制
#: kitty 的所有方面，包括向 kitty 窗口发送文本、
#: 打开新窗口、关闭窗口、读取窗口内容等。
#: 注意，这甚至可以通过 SSH 连接工作。
#: 默认设置 no 阻止任何形式的远程控制。
#: 各个值的含义如下：

#: password（密码）
#:     通过 TTY 设备和 socket 接收的远程控制请求
#:     基于密码确认，参见 remote_control_password。
#: socket-only（仅 socket）
#:     通过 socket 接收的远程控制请求
#:     无条件接受。通过 TTY 接收的请求被拒绝。
#:     参见 listen_on。
#: socket
#:     通过 socket 接收的远程控制请求
#:     无条件接受。通过 TTY 接收的请求基于密码确认。
#: no
#:     远程控制完全禁用。
#: yes
#:     远程控制请求始终接受。

# listen_on none

#: 监听指定的 socket 以接受远程控制连接。
#: 注意，这将应用于所有 kitty 实例。
#: 它可以被 kitty --listen-on 命令行选项覆盖。
#: 对于 UNIX socket，
#: 如 unix:${TEMP}/mykitty 或 unix:@mykitty（在 Linux 上）。
#: 环境变量会被展开，相对路径相对于临时目录解析。
#: 如果存在 {kitty_pid}，它将被替换为 kitty
#: 进程的 PID，否则 kitty 进程的 PID
#: 将被追加到值后面，用连字符分隔。
#: 对于 TCP socket，如 tcp:localhost:0，
#: 始终使用随机端口，即使指定了非零端口号。
#: 更多细节参见 kitty --listen-on 的帮助。
#: 注意，除非 allow_remote_control 设为
#: yes、socket 或 socket-only，否则此设置将被忽略。
#: 不支持通过重载配置来更改此选项。

# env

#: 指定在所有子进程中设置的环境变量。
#: 使用带等号的名称（例如 env VAR=）将将其设为空字符串。
#: 仅指定名称（例如 env VAR）将从子进程的
#: 环境中移除该变量。
#: 注意，环境变量会递归展开，例如::

#:     env VAR1=a
#:     env VAR2=${HOME}/${VAR1}/b

#: VAR2 的值将是 <home 目录路径>/a/b。

#: 使用特殊值 read_from_shell 让 kitty 从
#: 你的登录 shell 配置中读取指定的变量。
#: 当你的 shell 启动文件设置了一堆
#: 你希望在 kitty 和 kitty 会话文件中可用的
#: 环境变量时很有用。
#: 每个变量名被视为 glob 模式进行匹配。
#: 例如：env read_from_shell=PATH LANG LC_* XDG_* EDITOR VISUAL。
#: 注意，这些变量仅在配置完全处理后读取，
#: 因此它们不能用于递归展开，
#: 并且它们将覆盖其他 env 指令设置的任何变量。

# filter_notification

#: 指定规则以过滤 kitty 中运行的应用程序
#: 发送的通知。可以多次指定以创建多个过滤规则。
#: 规则规范的格式为 field:regexp。
#: 过滤规则可以匹配任何字段：title、body、app、type。
#: 特殊值 all 过滤所有通知。
#: 规则可以使用布尔运算符组合。一些例子::

#:     filter_notification title:hello or body:"abc.*def"
#:     # 过滤来自 vim 的通知，除了关于更新的通知，
#:     # (?i) 使匹配不区分大小写
#:     filter_notification app:"[ng]?vim" and not body:"(?i)update"
#:     # 过滤所有通知
#:     filter_notification all

#: app 字段是发送通知的应用程序名称，
#: type 是通知的类型。
#: 并非所有应用程序都会发送这些字段，
#: 所以你还可以匹配通知文本的标题和正文。
#: 更复杂的编程过滤和通知的自定义操作
#: 可以通过在 kitty 配置目录
#: （~/.config/kitty）中创建 notifications.py 文件来实现。
#: 一个带注释的示例可在
#: <https://github.com/kovidgoyal/kitty/blob/master/docs/notifications.py> 获取。

# watcher

#: 将加载为 watcher（观察者）的 Python 文件路径
#: <https://sw.kovidgoyal.net/kitty/launch/#watchers>。
#: 可以多次指定以加载多个 watcher。
#: watcher 将被添加到每个 kitty 窗口。
#: 相对路径相对于 kitty 配置目录解析。
#: 注意，重载配置仅影响重载后创建的窗口。

# exe_search_path

#: 控制 kitty 查找要运行的程序的路径。
#: 默认搜索顺序是：
#: 首先搜索系统范围的 PATH，
#: 然后是 ~/.local/bin 和 ~/bin。
#: 如果仍未找到，尝试登录 shell 加载其所有
#: 启动文件后定义的 PATH。
#: 最后，如果存在，尝试 env 选项指定的 PATH。

#: 此选项允许你在此搜索顺序中添加前缀、
#: 追加或移除路径。可以多次指定以设置多个路径。
#: 简单路径将被添加到搜索顺序的前面。
#: 以 + 号开头的路径将被追加到搜索顺序后，
#: 在上述 ~/bin 之后。
#: 以 - 号开头的路径将从整个搜索顺序中移除。
#: 例如::

#:     exe_search_path /some/prepended/path
#:     exe_search_path +/some/appended/path
#:     exe_search_path -/some/excluded/path

# update_check_interval 24

#: 定期检查 kitty 是否有可用的更新
#: 的间隔时间（小时）。
#: 如果找到更新，将显示系统通知告知你
#: 有可用更新。
#: 默认每 24 小时检查一次，设为零禁用。
#: 更新检查仅由官方二进制构建版本执行。
#: 发行版软件包或源码构建不执行更新检查。
#: 不支持通过重载配置更改此选项。

# auto_reload_config 0.1

#: 当配置文件更改时自动重新加载。
#: 此设置是重新加载配置文件前等待的秒数。
#: 这允许多个更改被防抖处理。
#: 使用负值禁用自动重新加载。
#: 你可以使用 reload_config_file 手动重新加载。
#: 注意，自动重新加载仅在 kitty 启动时
#: kitty.conf 已存在的情况下有效。
#: 通过重载配置更改此设置将被忽略。

# startup_session none

#: 用于所有 kitty 实例的会话文件路径。
#: 可以使用 kitty --session=none 命令行选项
#: 为各个实例覆盖。
#: 详见 kitty 文档中的 sessions
#: <https://sw.kovidgoyal.net/kitty/sessions/>。
#: 注意，相对路径相对于 kitty 配置目录解释。
#: 路径中的环境变量会被展开。
#: 不支持通过重载配置更改此选项。
#: 注意，如果 kitty 在调用时带有指定要运行的
#: 命令的命令行参数，此选项将被忽略。

# clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

#: 允许 kitty 中运行的程序读写剪贴板。
#: 你可以精确控制允许哪些操作。
#: 可能的操作有：write-clipboard（写入剪贴板）、
#: read-clipboard（读取剪贴板）、
#: write-primary（写入主选择区）、
#: read-primary（读取主选择区）、
#: read-clipboard-ask（读取剪贴板时询问）、
#: read-primary-ask（读取主选择区时询问）。
#: 默认允许写入剪贴板和主选择区，
#: 并在程序尝试读取剪贴板时请求许可。
#: 注意，禁用读取确认是安全风险，
#: 因为这意味着任何程序，甚至是通过 SSH 在
#: 远程服务器上运行的程序，都可以读取你的剪贴板。
#: 另见 clipboard_max_size。

# clipboard_max_size 512

#: kitty 中运行的程序将被存储以写入系统剪贴板的
#: 数据最大大小（MB）。
#: 值为零表示不应用大小限制。
#: 另见 clipboard_control。

# file_transfer_confirmation_bypass

#: 可提供给文件传输 kitten
#: <https://sw.kovidgoyal.net/kitty/kittens/transfer/>
#: 以跳过传输确认提示的密码。
#: 这应该只在从受信任的计算机、
#: 通过受信任的网络或加密传输发起传输时使用，
#: 因为它允许远程机器上运行的任何程序
#: 在没有权限的情况下读/写本地文件系统。

# allow_hyperlinks yes

#: 处理超链接转义序列 (OSC 8)。
#: 如果禁用，OSC 8 转义序列将被忽略。
#: 否则它们将成为可点击的链接，
#: 你可以用鼠标点击或使用 hints kitten
#: <https://sw.kovidgoyal.net/kitty/kittens/hints/> 来点击。
#: ask 特殊值表示 kitty 在点击链接前会询问。

# shell_integration enabled

#: 在支持的 shell 上启用 shell 集成。
#: 这可以启用诸如跳转到之前的提示符、
#: 在分页器中浏览上一个命令的输出等功能，
#: 在支持的 shell 上。
#: 设为 disabled 完全关闭 shell 集成。
#: 也可以禁用个别功能，设为由空格分隔的
#: 这些值的列表：no-rc、no-cursor、no-title、
#: no-cwd、no-prompt-mark、no-complete、no-sudo。
#: 详见 Shell integration
#: <https://sw.kovidgoyal.net/kitty/shell-integration/>。

# allow_cloning ask

#: 控制终端中运行的程序是否可以请求
#: 创建新窗口。典型示例是 clone-in-kitty
#: <https://sw.kovidgoyal.net/kitty/shell-integration/#clone-shell>。
#: 默认情况下，kitty 会为每个克隆请求询问许可。
#: 无条件允许克隆使终端中运行的程序（包括
#: 通过 SSH）获得以运行终端的用户身份
#: 在终端运行的计算机上执行任意代码的权限。

# clone_source_strategies venv,conda,env_var,path

#: 控制在新克隆窗口中运行 clone-in-kitty
#: 时加载哪些 shell 代码。
#: 支持的策略有：

#: venv
#:     加载文件 $VIRTUAL_ENV/bin/activate。
#:     这由 Python stdlib venv 模块使用，
#:     允许自动克隆 venv。
#: conda
#:     运行 conda activate $CONDA_DEFAULT_ENV。
#:     这支持 conda 创建的虚拟环境。
#: env_var
#:     使用 eval 执行环境变量
#:     KITTY_CLONE_SOURCE_CODE 的内容。
#: path
#:     加载环境变量 KITTY_CLONE_SOURCE_PATH
#:     指向的文件。

#: 此选项必须是上述值的逗号分隔列表。
#: 仅按指定顺序找到的第一个有效匹配被加载。

# notify_on_cmd_finish never

#: 当长时间运行的命令完成时显示桌面通知
#: （需要 shell_integration）。可能的值有：

#: never（从不）
#:     从不发送通知

#: unfocused（未聚焦）
#:     仅在窗口没有键盘焦点时发送通知

#: invisible（不可见）
#:     仅在窗口既未聚焦又对用户不可见时发送通知，
#:     例如因为它在非活跃标签中，或其 OS 窗口
#:     当前不可见（在支持 OS 窗口可见性查询的平台上，
#:     仅当 OS 窗口活跃时才被视为可见）

#: always（始终）
#:     始终发送通知，无论窗口状态如何

#: 有两个可选参数：

#: 首先，被视为长时间运行命令的最短持续时间。
#: 默认是 5 秒。指定第二个参数来设置持续时间。
#: 例如：invisible 15。不要将值设得太小，
#: 否则启动新 OS 窗口后退出的命令会产生通知垃圾。

#: 其次，要执行的操作。默认是 notify。可能的值：

#: notify（通知）
#:     发送桌面通知。后续参数是可选的，指定通知何时
#:     自动清除。可能的事件有：focus 和 next。
#:     focus 表示当通知策略为 unfocused 或 invisible 时，
#:     当窗口重新获得焦点时通知自动清除。
#:     next 值表示在显示下一个通知时清除上一个通知。
#:     当未指定参数时的默认值是：focus next。

#: bell（响铃）
#:     触发终端响铃

#: notify-bell（通知加响铃）
#:     发送桌面通知并触发终端响铃。
#:     参数与 notify 相同

#: command（命令）
#:     运行自定义命令。所有后续参数是要运行的命令行。

#: 更多示例::

#:     # 当命令在未聚焦窗口中运行超过 5 秒时发送通知
#:     notify_on_cmd_finish unfocused
#:     # 当命令在不可见窗口中运行超过 10 秒时发送通知
#:     notify_on_cmd_finish invisible 10.0
#:     # 当命令在不可见窗口中运行超过 10 秒时响铃
#:     notify_on_cmd_finish invisible 10.0 bell
#:     # 当命令在不可见窗口中运行超过 10 秒时运行 notify-send
#:     # 这里 %c 被替换为当前命令行，%s 被替换为作业退出码
#:     notify_on_cmd_finish invisible 10.0 command notify-send "job finished with status: %s" %c
#:     # 当下一个命令完成或窗口重新获得焦点时不自动清除上一个通知
#:     notify_on_cmd_finish invisible 5.0 notify

# term xterm-kitty

#: 要设置的 TERM 环境变量的值。
#: 更改此值可能会破坏许多终端程序，
#: 只在你知道自己在做什么时才更改它，
#: 而不是因为你在"Stack Overflow"上读到
#: 某些建议说要更改它。
#: TERM 变量被各种程序用来获取关于终端
#: 能力和行为的信息。如果你更改它，
#: 取决于你运行的程序，以及你更改到的终端
#: 有多不同，从按键操作到颜色到各种
#: 高级功能都可能不工作。
#: 重载配置更改此选项仅影响新创建的窗口。

# terminfo_type path

#: 要设置的 TERMINFO 环境变量的值。
#: 此变量被终端中运行的程序用于搜索
#: terminfo 数据库。
#: 默认值 path 导致 kitty 将其设置为包含
#: kitty terminfo 数据库的文件系统位置。
#: direct 值表示将整个数据库直接放入环境变量中。
#: 这在连接到容器等场景中可能有用，
#: 但请注意，并非所有软件都支持此方式。
#: none 值表示不触碰此变量。

# forward_stdio no

#: 将 kitty 进程的 STDOUT 和 STDERR
#: 转发给子进程。这对于调试很有用，
#: 因为它允许子进程直接打印到 kitty 的 STDOUT。
#: 例如，在 shell 中使用 echo hello world
#: >&$KITTY_STDIO_FORWARDED 将打印到父 kitty
#: 的 STDOUT。
#: 设置 KITTY_STDIO_FORWARDED=fdnum 环境变量，
#: 以便子进程知道转发。
#: 注意，在 macOS 上，这会阻止 shell 通过
#: login 工具运行，因此在此会话中运行的程序中
#: getlogin() 将不工作。

# menu_map

#: 为 kitty 中的各种菜单指定条目。
#: 目前仅支持 macOS 上的全局菜单栏。例如::

#:    menu_map global "Actions::Launch something special" launch --hold --type=os-window sh -c "echo hello world"

#: 这将在 macOS 全局菜单栏中创建一个名为
#: "Actions" 的菜单，
#: 其中包含一个名为 "Launch something special" 的菜单条目。
#: 子菜单可以通过添加由 :: 字符分隔的
#: 更多层级来创建。

#: }}}

#: 操作系统特定调整 {{{

# wayland_titlebar_color system

#: 在具有客户端窗口装饰的 Wayland 系统
#: （如 GNOME）上，kitty 窗口标题栏的颜色。
#: system 值表示使用默认系统颜色，
#: background 值表示使用当前活跃 kitty 窗口
#: 的背景色，最后你也可以使用任意颜色，
#: 如 #12af59 或 red。

# macos_titlebar_color system

#: 在 macOS 上 kitty 窗口标题栏的颜色。
#: system 值表示使用默认系统颜色，
#: light 或 dark 也可用于显式设置。
#: background 值表示使用当前活跃窗口的背景色，
#: 最后你也可以使用任意颜色，如 #12af59 或 red。

#: 注意，当使用 auto_color_scheme
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 时，此选项被配色方案文件覆盖，必须在其中设置才能生效。

# macos_option_as_alt no

#: 在 macOS 上将 Option 键用作 Alt 键。
#: 设为 no 时，kitty 将使用 macOS 原生的
#: Option+Key 输入 Unicode 字符行为。
#: 这会破坏终端程序中的任何 Alt+Key 键盘快捷键，
#: 但你可以使用 macOS Unicode 输入技术。
#: 你可以使用 left、right 或 both 值来仅将
#: 左、右或两个 Option 键用作 Alt。
#: 注意，kitty 本身始终将 Option 视为与 Alt 相同。
#: 这意味着你不能使用此选项为
#: Option+Key 和 Alt+Key 配置不同的 kitty 快捷键。
#: 此外，任何使用 Option/Alt+Key 的 kitty 快捷键
#: 将优先，因此任何此类按键都不会传递给
#: 在 kitty 中运行的终端程序。
#: 不支持通过重载配置更改此选项。

# macos_hide_from_tasks no

#: 在 macOS 上从运行任务（⌘+Tab 和 Dock）中
#: 隐藏 kitty 窗口。
#: 不支持通过重载配置更改此选项。

# macos_quit_when_last_window_closed no

#: 在 macOS 上关闭所有顶层窗口时退出 kitty。
#: 默认情况下，kitty 将保持运行，即使没有
#: 打开的窗口，这是 macOS 上的预期行为。

# macos_window_resizable yes

#: 如果你希望在 macOS 上 kitty 顶层 OS 窗口
#: 不可调整大小，请禁用此选项。

# macos_thicken_font 0

#: 在字体周围绘制具有给定宽度的额外边框，
#: 以增加 macOS 上小字号的易读性。
#: 例如，值为 0.75 的渲染效果类似于
#: 常见字号下的亚像素抗锯齿。
#: 注意，在现代 kitty 中，此选项已过时
#: （但仍受支持）。建议改用 text_composition_strategy。

# macos_traditional_fullscreen no

#: 使用 macOS 传统全屏过渡，更快但不太美观。

# macos_fullscreen_ignore_safe_area_insets no

#: 当使用 macos_traditional_fullscreen 时，
#: 在具有刘海屏的 MacBook 屏幕等显示器上
#: 忽略安全区域内边距。
#: 这使 kitty 可以使用整个显示区域，
#: 而不是为刘海区域留出空间。

# macos_show_window_title_in all

#: 控制在 macOS 上窗口标题的显示位置。
#: window 值将在 macOS 窗口顶部显示
#: 当前活跃窗口的标题。
#: menubar 值将在 macOS 全局菜单栏中显示
#: 当前活跃窗口的标题，利用原本浪费的空间。
#: all 值将在两个位置都显示标题，
#: none 隐藏标题。
#: 参见 macos_menubar_title_max_length
#: 了解如何控制菜单栏中标题的长度。

# macos_menubar_title_max_length 0

#: 在 macOS 全局菜单栏中显示的
#: 窗口标题的最大字符数。
#: 小于 1 的值表示没有最大限制。

# macos_custom_beam_cursor no

#: 在 macOS 上使用自定义鼠标光标，
#: 在浅色和深色背景上都更易看到。
#: 如今，默认的 macOS 光标已带有白色边框。
#: 警告：在双 GPU 机器上这可能会使你的
#: 鼠标光标不可见。
#: 不支持通过重载配置更改此选项。

# macos_colorspace srgb

#: 解释终端颜色使用的色彩空间。
#: 默认值 srgb 将使颜色与在网页浏览器中
#: 看到的颜色匹配。
#: default 值将使用显示器的原生色彩空间。
#: displayp3 值将使用 Apple 特殊的
#: Display P3 色彩空间，这将导致颜色过饱和
#: （更鲜艳），并有一些颜色偏移。
#: 重载配置更改此值仅影响新创建的 OS 窗口。

# linux_display_server auto

#: 在 Wayland 和 X11 后端之间选择。
#: 默认情况下，基于系统状态自动选择
#: 适当的后端。设为 x11 或 wayland 强制选择。
#: 不支持通过重载配置更改此选项。

# wayland_enable_ime yes

#: 在 Wayland 上启用输入法扩展。
#: 这通常用于输入东亚语言文字。
#: 但是，它在 Wayland 中的实现通常有 bug
#: 并会在输入循环中引入延迟，
#: 所以如果你确定不需要它，可以禁用。
#: 不支持通过重载配置更改此选项，不会有效果。

#: }}}

#: 键盘快捷键 {{{

#: 按键简单地由其小写 Unicode 字符标识。
#: 例如：a 代表 A 键，[ 代表左方括号键等。
#: 对于功能键，如 Enter 或 Escape，
#: 名称见功能键定义
#: <https://sw.kovidgoyal.net/kitty/keyboard-protocol/#functional>。
#: 对于修饰键，名称是 ctrl（control，⌃）、
#: shift（⇧）、alt（opt、option，⌥）、
#: super（cmd、command，⌘）。

#: 简单的快捷键映射使用 map 指令完成。
#: 关于高级映射的完整细节，包括模态和
#: 按应用程序映射，请参见 mapping
#: <https://sw.kovidgoyal.net/kitty/mapping/>。
#: 一些快速示例来说明常见任务::

#:     # 取消映射一个键盘快捷键，将其传递给在 kitty 中运行的程序
#:     map kitty_mod+space
#:     # 完全忽略一个键盘事件
#:     map ctrl+alt+f1 discard_event
#:     # 组合多个操作
#:     map kitty_mod+e combine : new_window : next_layout
#:     # 多键快捷键
#:     map ctrl+x>ctrl+y>z action

#: 对于非拉丁键盘布局（俄语、阿拉伯语等），
#: --allow-fallback 选项控制物理按键回退。
#: 值：shifted（默认 — Shift 键回退）、
#: ascii（备用键/物理位置回退，仅非 ASCII 键）、
#: none（禁用所有回退），
#: 或逗号分隔的组合。
#: 所有默认快捷键使用 --allow-fallback=shifted,ascii::

#:     map --allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard

#: 你可以通过按下 command_palette 来浏览和触发
#: 这些操作，运行命令面板。
#: 可映射到按键的完整操作列表在此处：
#: <https://sw.kovidgoyal.net/kitty/actions/>。

kitty_mod alt

#: 默认快捷键的特殊修饰键别名。
#: 你可以更改此选项的值来更改所有使用
#: kitty_mod 的默认快捷键。

# clear_all_shortcuts no

#: 移除此处之前的所有快捷键定义。
#: 例如，用于移除默认快捷键。

# map_timeout 0.0

#: 多键映射和模态键盘模式的默认超时时间（秒）。
#: 如果你按下多键映射的前几个键，
#: 但在此超时时间内没有按下一个键，
#: 映射将被取消且模式退出。
#: 值为零禁用超时。
#: 可以在使用 --new-mode 创建键盘模式时
#: 通过 --timeout 选项为特定模式覆盖此设置。
#: 例如::

#:     # 所有映射 2 秒超时
#:     map_timeout 2.0

#:     # 此模式将有 5 秒超时（覆盖全局 2 秒超时）
#:     map --new-mode resize --timeout 5.0 kitty_mod+r

# action_alias

#: 例如: action_alias launch_tab launch --type=tab --cwd=current

#: 定义操作别名以避免在多个映射中
#: 重复相同的选项。可以为任何操作定义别名，
#: 并将被递归展开。
#: 例如，上面的别名允许你创建在
#: 当前工作目录中启动新标签页的映射，无需重复::

#:     map f1 launch_tab vim
#:     map f2 launch_tab emacs

#: 类似地，为 kitten 调用创建别名::

#:     action_alias hints kitten hints --hints-offset=0

# kitten_alias

#: 例如: kitten_alias hints hints --hints-offset=0

#: 与上面的 action_alias 类似，但专门用于 kitten。
#: 通常，建议使用 action_alias。
#: 此选项是遗留版本，为向后兼容而保留。
#: 它导致别名 kitten 的所有调用都被替换。
#: 因此上面的例子将导致 hints kitten 的所有调用
#: 都应用 --hints-offset=0 选项。

#: 剪贴板 {{{

#: 复制到剪贴板

# map --allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard

#::  还有一个 copy_or_interrupt 操作，
#::  可选择映射到 Ctrl+C。
#::  它只会在有选择时复制，否则发送中断信号。
#::  类似地，copy_and_clear_or_interrupt 将
#::  复制并清除选择，或在没有选择时发送中断。
#::  copy_or_noop 操作将在有选择时复制，
#::  没有选择时将按键传递给终端中运行的应用程序。

#: 复制到剪贴板或传递

# map --allow-fallback=shifted,ascii cmd+c copy_or_noop

#: 从剪贴板粘贴

# map --allow-fallback=shifted,ascii kitty_mod+v paste_from_clipboard
# map --allow-fallback=shifted,ascii cmd+v paste_from_clipboard

#: 从选择区粘贴

# map --allow-fallback=shifted,ascii kitty_mod+s paste_from_selection
# map shift+insert                   paste_from_selection

#: 将选择传递给程序

# map --allow-fallback=shifted,ascii kitty_mod+o pass_selection_to_program

#::  你也可以使用 pass_selection_to_program
#::  将当前选择的内容传递给任何程序。
#::  默认情况下，使用系统的 open 程序，
#::  但你可以指定自己的程序，
#::  选择的内容将作为命令行参数传递给程序。
#::  例如::

#::      map kitty_mod+o pass_selection_to_program firefox

#::  你可以使用 @selection 占位符将当前选择
#::  传递给在新 kitty 窗口中运行的终端程序::

#::      map kitty_mod+y new_window less @selection

#: }}}

#: 滚动 {{{

#: 向上滚动一行

# map kitty_mod+up                   scroll_line_up smooth
# map --allow-fallback=shifted,ascii kitty_mod+k scroll_line_up smooth
# map opt+cmd+page_up                scroll_line_up smooth
# map cmd+up                         scroll_line_up smooth

#: 向下滚动一行

# map kitty_mod+down                 scroll_line_down smooth
# map --allow-fallback=shifted,ascii kitty_mod+j scroll_line_down smooth
# map opt+cmd+page_down              scroll_line_down smooth
# map cmd+down                       scroll_line_down smooth

#: 向上翻页

# map kitty_mod+page_up scroll_page_up
# map cmd+page_up       scroll_page_up

#: 向下翻页

# map kitty_mod+page_down scroll_page_down
# map cmd+page_down       scroll_page_down

#: 滚动到顶部

# map kitty_mod+home scroll_home
# map cmd+home       scroll_home

#: 滚动到底部

# map kitty_mod+end scroll_end
# map cmd+end       scroll_end

#: 滚动到上一个 shell 提示符

# map --allow-fallback=shifted,ascii kitty_mod+z scroll_to_prompt -1

#::  使用参数 0 的 scroll_to_prompt 可以滚动到
#::  上次跳转到或上次点击的位置。
#::  需要 shell 集成
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/> 才能工作。

#: 滚动到下一个 shell 提示符

# map --allow-fallback=shifted,ascii kitty_mod+x scroll_to_prompt 1

#: 在分页器中浏览回滚缓冲区

# map --allow-fallback=shifted,ascii kitty_mod+h show_scrollback

#::  你可以使用 launch --stdin-source
#::  将当前屏幕和历史缓冲区的内容
#::  作为 STDIN 管道传送到任意程序。
#::  例如，以下在覆盖窗口中用 less 打开回滚缓冲区::

#::      map f1 launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay less +G -R

#::  关于将屏幕和缓冲区内容管道传送到外部程序
#::  的更多细节，请参见 launch
#::  <https://sw.kovidgoyal.net/kitty/launch/>。

#: 在分页器中浏览上一个 shell 命令的输出

# map --allow-fallback=shifted,ascii kitty_mod+g show_last_command_output

#::  你还可以定义额外的快捷键来获取命令输出。
#::  例如，获取屏幕上的第一个命令输出::

#::      map f1 show_first_command_output_on_screen

#::  获取上次通过键盘操作或鼠标操作访问的命令输出::

#::      map f1 show_last_visited_command_output

#::  你可以使用 launch 操作将 shell 中运行的
#::  上一个命令的输出管道传送出去。
#::  例如，以下在覆盖窗口中用 less 打开输出::

#::      map f1 launch --stdin-source=@last_cmd_output --stdin-add-formatting --type=overlay less +G -R

#::  要获取屏幕上第一个命令的输出，
#::  使用 @first_cmd_output_on_screen。
#::  要获取上次跳转到的命令的输出，
#::  使用 @last_visited_cmd_output。

#::  需要 shell 集成
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/> 才能工作。

#: 在分页器中搜索回滚

# map kitty_mod+/                    search_scrollback
# map --allow-fallback=shifted,ascii cmd+f search_scrollback

#::  使用配置的 scrollback_pager 搜索回滚中
#::  当前选中的文本。
#::  假设按 / 键触发分页器中的搜索模式。
#::  如果你想为此创建使用特殊分页器的手动映射，
#::  可以使用类似：

#::      map f1 combine : launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay mypager : send_key /

#::  对于更复杂的控制，例如使用当前选择，
#::  请使用 remote_control_script。

#: }}}

#: 窗口管理 {{{

#: 新建窗口

map kitty_mod+; new_window
# map cmd+enter       new_window

#::  你可以打开一个运行任意程序的新 kitty 窗口，
#::  例如::

#::      map kitty_mod+y launch mutt

#::  你可以打开一个工作目录设为当前窗口
#::  工作目录的新窗口::

#::      map ctrl+alt+enter launch --cwd=current

#::  你可以通过 launch --allow-remote-control
#::  打开一个允许通过 kitty 远程控制来控制 kitty
#::  的新窗口。在该窗口中运行的任何程序都将
#::  被允许控制 kitty。例如::

#::      map ctrl+enter launch --allow-remote-control some_program

#::  你可以在当前活跃窗口旁边打开新窗口，
#::  或作为第一个窗口::

#::      map ctrl+n launch --location=neighbor
#::      map ctrl+f launch --location=first

#::  更多细节，请参见 launch
#::  <https://sw.kovidgoyal.net/kitty/launch/>。

#: 新建 OS 窗口

# map --allow-fallback=shifted,ascii kitty_mod+n new_os_window
# map --allow-fallback=shifted,ascii cmd+n new_os_window

#::  与上面的 new_window 类似，但打开一个顶层 OS 窗口。
#::  特别是你可以使用 new_os_window_with_cwd
#::  打开一个具有当前工作目录的窗口。

#: 关闭窗口

# map --allow-fallback=shifted,ascii kitty_mod+w close_window
# map --allow-fallback=shifted,ascii shift+cmd+d close_window

#: 下一个窗口

# map kitty_mod+] next_window

#: 上一个窗口

# map kitty_mod+[ previous_window

#: 窗口前移

# map --allow-fallback=shifted,ascii kitty_mod+f move_window_forward

#: 窗口后移

# map --allow-fallback=shifted,ascii kitty_mod+b move_window_backward

#: 移动窗口到最前

# map kitty_mod+` move_window_to_top

#: 开始调整窗口大小

# map --allow-fallback=shifted,ascii kitty_mod+r start_resizing_window
# map --allow-fallback=shifted,ascii cmd+r start_resizing_window

#: 第一个窗口

# map kitty_mod+1 first_window
# map cmd+1       first_window

#: 第二个窗口

# map kitty_mod+2 second_window
# map cmd+2       second_window

#: 第三个窗口

# map kitty_mod+3 third_window
# map cmd+3       third_window

#: 第四个窗口

# map kitty_mod+4 fourth_window
# map cmd+4       fourth_window

#: 第五个窗口

# map kitty_mod+5 fifth_window
# map cmd+5       fifth_window

#: 第六个窗口

# map kitty_mod+6 sixth_window
# map cmd+6       sixth_window

#: 第七个窗口

# map kitty_mod+7 seventh_window
# map cmd+7       seventh_window

#: 第八个窗口

# map kitty_mod+8 eighth_window
# map cmd+8       eighth_window

#: 第九个窗口

# map kitty_mod+9 ninth_window
# map cmd+9       ninth_window

#: 第十个窗口

# map kitty_mod+0 tenth_window

#: 可视化选择并聚焦窗口

map kitty_mod+f focus_visible_window

#::  在窗口上显示覆盖的数字和字母，
#::  当你按下对应键时切换焦点到该窗口。
#::  当只有两个窗口时，直接切换焦点而不显示覆盖。
#::  你可以通过 visual_window_select_characters
#::  选项更改覆盖字符及其顺序。

#: 可视化交换窗口

# map kitty_mod+f8 swap_with_window

#::  与上面的 focus_visible_window 类似，但交换窗口。

#: }}}

#: 标签管理 {{{

#: 下一个标签

map kitty_mod+n next_tab
# map shift+cmd+]     next_tab
# map ctrl+tab        next_tab

#: 上一个标签

map kitty_mod+p previous_tab
# map shift+cmd+[    previous_tab
# map ctrl+shift+tab previous_tab

#: 新建标签

map --allow-fallback=shifted,ascii kitty_mod+t new_tab
# map --allow-fallback=shifted,ascii cmd+t new_tab

#: 关闭标签

map --allow-fallback=shifted,ascii kitty_mod+q close_tab
# map --allow-fallback=shifted,ascii cmd+w close_tab

#: 关闭 OS 窗口

# map --allow-fallback=shifted,ascii shift+cmd+w close_os_window

#: 标签前移

# map kitty_mod+. move_tab_forward

#: 标签后移

# map kitty_mod+, move_tab_backward

#: 设置标签标题

map --allow-fallback=shifted,ascii kitty_mod+alt+r set_tab_title
# map --allow-fallback=shifted,ascii shift+cmd+i set_tab_title

#: 你还可以创建转到特定标签的快捷键，
#: 1 是第一个标签，2 是第二个标签，
#: -1 是上一个活跃标签，-2 是上上个活跃标签，
#: 以此类推。任何大于标签数的数字转到最后一个标签，
#: 任何小于历史中先前使用标签数的负数转到
#: 历史中最旧的先前使用标签::

map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9

#: 就像上面的 new_window 一样，
#: 你也可以在使用 new_tab 和 new_tab_with_cwd 时
#: 传递任意命令的名称来运行。
#: 最后，如果你希望新标签在当前标签旁边打开，
#: 而不是在标签列表末尾::

#:     map ctrl+t new_tab !neighbor [optional cmd to run]
#: }}}

#: 布局管理 {{{

#: 下一个布局

map --allow-fallback=shifted,ascii kitty_mod+v next_layout

#: 你还可以创建切换到特定布局的快捷键::

#:     map ctrl+alt+t goto_layout tall
#:     map ctrl+alt+s goto_layout stack

#: 类似地，切换回上一个布局::

#:     map ctrl+alt+p last_used_layout

#: 还有一个 toggle_layout 操作，
#: 切换到指定布局，如果已在指定布局中则切换回
#: 上一个布局。用于通过切换到 stack 布局
#: 临时"放大"活跃窗口::

map kitty_mod+o toggle_layout stack
#: }}}

#: 字体大小 {{{

#: 你可以一次性更改所有顶层 kitty OS 窗口的
#: 字体大小，或仅更改当前窗口的。

#: 增大字体

# map kitty_mod+equal  change_font_size all +2.0
# map kitty_mod+plus   change_font_size all +2.0
# map kitty_mod+kp_add change_font_size all +2.0
# map cmd+plus         change_font_size all +2.0
# map cmd+equal        change_font_size all +2.0
# map shift+cmd+equal  change_font_size all +2.0

#: 减小字体

# map kitty_mod+minus       change_font_size all -2.0
# map kitty_mod+kp_subtract change_font_size all -2.0
# map cmd+minus             change_font_size all -2.0
# map shift+cmd+minus       change_font_size all -2.0

#: 重置字体大小

# map kitty_mod+backspace change_font_size all 0
# map cmd+0               change_font_size all 0

#: 设置特定字体大小的快捷键::

#:     map kitty_mod+f6 change_font_size all 10.0

#: 设置仅更改当前 OS 窗口字体大小的快捷键::

#:     map kitty_mod+f6 change_font_size current 10.0

#: 设置乘/除字体大小的快捷键::

#:     map kitty_mod+f6 change_font_size all *2.0
#:     map kitty_mod+f6 change_font_size all /2.0
#: }}}

#: 选择并操作可见文本 {{{

#: 使用 hints kitten 选择文本，并将其传递给
#: 外部程序、插入终端或复制到剪贴板。

#: 打开 URL

# map --allow-fallback=shifted,ascii kitty_mod+e open_url_with_hints

#::  使用键盘打开当前可见的 URL。
#::  打开 URL 使用的程序由 open_url_with 指定。

#: 插入选中的路径

# map --allow-fallback=shifted,ascii kitty_mod+p>f kitten hints --type path --program -

#::  选择一个路径/文件名并将其插入终端。
#::  例如，用于对上一个 git 命令输出的文件名
#::  运行 git 命令。

#: 打开选中的路径

# map --allow-fallback=shifted,ascii kitty_mod+p>shift+f kitten hints --type path

#::  选择一个路径/文件名并使用默认打开程序打开它。

#: 插入选择的文件

# map --allow-fallback=shifted,ascii kitty_mod+p>c kitten choose-files

#::  使用 choose-files
#::  <https://sw.kovidgoyal.net/kitty/kittens/choose-files/>
#::  kitten 选择文件并将其插入终端。

#: 插入选择的目录

# map --allow-fallback=shifted,ascii kitty_mod+p>d kitten choose-files --mode=dir

#::  使用 choose-files kitten 选择目录并将其插入终端。

#: 插入选中的行

# map --allow-fallback=shifted,ascii kitty_mod+p>l kitten hints --type line --program -

#::  选择一行文本并将其插入终端。
#::  适用于 `ls -1` 之类的命令输出。

#: 插入选中的单词

map --allow-fallback=shifted,ascii kitty_mod+w kitten hints --type word --program -

#::  选择单词并将其插入终端。

#: 插入选中的哈希值

# map --allow-fallback=shifted,ascii kitty_mod+p>h kitten hints --type hash --program -

#::  选择看起来像哈希值的内容并将其插入终端。
#::  适用于使用 SHA1 哈希标识提交的 git。

#: 打开选中文件的指定行

# map --allow-fallback=shifted,ascii kitty_mod+p>n kitten hints --type linenum

#::  选择看起来像 filename:linenum 的内容，
#::  并在默认编辑器中打开该文件的指定行。

#: 打开选中的超链接

# map --allow-fallback=shifted,ascii kitty_mod+p>y kitten hints --type hyperlink

#::  选择超链接（即终端程序标记为超链接的 URL，
#::  例如通过 `ls --hyperlink=auto`）。

#: hints kitten 有更多可以映射到不同快捷键的
#: 操作模式。完整描述请参见 hints kitten
#: <https://sw.kovidgoyal.net/kitty/kittens/hints/>。
#: }}}

#: 杂项 {{{

#: 显示文档

# map kitty_mod+f1 show_kitty_doc overview

#: 命令面板

map kitty_mod+m command_palette

#: 切换全屏

# map kitty_mod+f11                  toggle_fullscreen
# map --allow-fallback=shifted,ascii ctrl+cmd+f toggle_fullscreen

#: 切换最大化

# map kitty_mod+f10 toggle_maximized

#: 切换 macOS 安全键盘输入

# map --allow-fallback=shifted,ascii opt+cmd+s toggle_macos_secure_keyboard_entry

#: macOS 循环切换 OS 窗口

# map cmd+` macos_cycle_through_os_windows

#: macOS 反向循环切换 OS 窗口

# map cmd+shift+` macos_cycle_through_os_windows_backwards

#: Unicode 输入

# map --allow-fallback=shifted,ascii kitty_mod+u kitten unicode_input
# map ctrl+cmd+space                 kitten unicode_input

#: 编辑配置文件

# map kitty_mod+f2 edit_config_file
# map cmd+,        edit_config_file

#: 打开 kitty 命令 shell

# map kitty_mod+escape kitty_shell window

#::  在新窗口/标签页/覆盖/OS 窗口中打开 kitty shell
#::  以使用命令控制 kitty。

#: 增加背景不透明度

# map --allow-fallback=shifted,ascii kitty_mod+a>m set_background_opacity +0.1

#: 减少背景不透明度

# map --allow-fallback=shifted,ascii kitty_mod+a>l set_background_opacity -0.1

#: 使背景完全不透明

# map --allow-fallback=shifted,ascii kitty_mod+a>1 set_background_opacity 1

#: 重置背景不透明度

# map --allow-fallback=shifted,ascii kitty_mod+a>d set_background_opacity default

#: 重置终端

# map kitty_mod+delete clear_terminal reset active
# map opt+cmd+r        clear_terminal reset active

#::  你可以创建快捷键来清除/重置终端。例如::

#::      # 重置终端
#::      map f1 clear_terminal reset active
#::      # 通过擦除所有内容清除终端屏幕
#::      map f1 clear_terminal clear active
#::      # 通过擦除清除终端回滚
#::      map f1 clear_terminal scrollback active
#::      # 将屏幕内容滚动到回滚中
#::      map f1 clear_terminal scroll active
#::      # 清除屏幕上从开头到光标行或当前提示符开始处的所有内容（需要 shell 集成）
#::      map f1 clear_terminal to_cursor active
#::      # 同上，但清除的行被移到回滚中
#::      map f1 clear_terminal to_cursor_scroll active
#::      # 擦除最后一个命令及其输出（需要 shell 集成才能工作）
#::      map f1 clear_terminal last_command active

#::  如果你想操作所有 kitty 窗口而不仅仅是当前窗口，
#::  使用 all 代替 active。

#::  一些可以在 shell rc 文件中定义的有用函数，
#::  用于执行当前窗口的各种清除操作：

#::  .. code-block:: sh

#::      clear-only-screen() {
#::          printf "\e[H\e[2J"
#::      }

#::      clear-screen-and-scrollback() {
#::          printf "\e[H\e[3J"
#::      }

#::      clear-screen-saving-contents-in-scrollback() {
#::          printf "\e[H\e[22J"
#::      }

#::  例如，使用这些转义码，可以将 Ctrl+L
#::  重新映射为既将当前屏幕内容滚动到回滚缓冲区
#::  又清除屏幕，而不仅仅是清除屏幕。
#::  对于 ZSH，在 ~/.zshrc 中添加：

#::  .. code-block:: zsh

#::      ctrl_l() {
#::          builtin print -rn -- $'\r\e[0J\e[H\e[22J' >"$TTY"
#::          builtin zle .reset-prompt
#::          builtin zle -R
#::      }
#::      zle -N ctrl_l
#::      bindkey '^l' ctrl_l

#::  或者，你可以直接在 kitty.conf 中添加
#::  map ctrl+l clear_terminal to_cursor_scroll active，
#::  它无需更改 shell rc 文件就能工作，
#::  但只清除到提示符处，不会清除提示符本身的任何文本。

#: 清除到开头

# map cmd+k clear_terminal to_cursor active

#: 清除回滚

# map option+cmd+k clear_terminal scrollback active

#: 清除最后一个命令

# map cmd+l clear_terminal last_command active

#: 清除屏幕

# map cmd+ctrl+l clear_terminal to_cursor_scroll active

#: 重新加载 kitty.conf

# map kitty_mod+f5 load_config_file
# map ctrl+cmd+,   load_config_file

#::  重新加载 kitty.conf，应用自上次加载以来的
#::  任何更改。注意，少数选项不能动态更改，
#::  需要完全重启 kitty。
#::  特别是，更改 macOS 全局菜单栏上的操作快捷键时，
#::  需要完全重启。你还可以映射按键来加载不同的
#::  配置文件，例如::

#::      map f5 load_config /path/to/alternative/kitty.conf

#::  注意，原始 kitty.conf 中的所有选项都被丢弃，
#::  换句话说，新配置*替换*旧配置。

#: 调试 kitty 配置

# map kitty_mod+f6 debug_config
# map opt+cmd+,    debug_config

#::  显示 kitty 正在运行的确切配置及其主机环境
#::  的详细信息。用于调试问题。

#: 在按键时发送任意文本

#::  例如：map ctrl+shift+alt+h send_text all Hello World

#::  你可以告诉 kitty 在按下指定快捷键时
#::  向客户端程序发送任意（UTF-8）编码的文本。
#::  例如::

#::      map ctrl+alt+a send_text all Special text

#::  当你按下 Ctrl+Alt+A 组合键时，
#::  这将发送 "Special text"。
#::  要发送的文本会解码 ANSI C 转义
#::  <https://www.gnu.org/software/bash/manual/html_node/ANSI_002dC-Quoting.html>，
#::  因此你可以使用像 \e 这样的转义来发送控制码，
#::  或 ⇻ 来发送 Unicode 字符
#::  （或者你直接输入 Unicode 字符作为 UTF-8 文本）。
#::  你可以使用 `kitten show-key` 获取你想要
#::  模拟的按键转义码。

#::  send_text 的第一个参数是激活快捷键的键盘模式。
#::  可能的值为 normal、application、kitty
#::  或它们的逗号分隔组合。
#::  normal 和 application 模式指终端的 DECCKM
#::  光标键模式，kitty 指 kitty 扩展键盘协议。
#::  特殊值 all 表示以上所有模式。

#::  更多示例::

#::      # 输出一个单词并将光标移到行首（就像输入然后按 Home）
#::      map ctrl+alt+a send_text normal Word\e[H
#::      map ctrl+alt+a send_text application Word\eOH
#::      # 在 shell 提示符处运行命令（就像输入命令然后按 Enter）
#::      map ctrl+alt+a send_text normal,application some command with arguments\r

#: 打开 kitty 网站

# map shift+cmd+/ open_url https://sw.kovidgoyal.net/kitty/

#: 隐藏 macOS kitty 应用程序

# map cmd+h hide_macos_app

#: 隐藏 macOS 其他应用程序

# map opt+cmd+h hide_macos_other_apps

#: 最小化 macOS 窗口

# map cmd+m minimize_macos_window

#: 退出 kitty

# map cmd+q quit

#: }}}

